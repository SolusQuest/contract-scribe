name: SolusAgent first internal install proof

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  install-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Require trusted manual main invocation
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(uname -m)" = x86_64
      - name: Check out the qualified public consumer fixtures
        uses: actions/checkout@v4
        with:
          repository: SolusQuest/solus-agent
          ref: 076bcda2fbe1da2677ac5c6fd03d75bc0fef66ad
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - name: Install exact private packages and execute Scribe consumer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/packages/verify-consumers.ts --feed https://nuget.pkg.github.com/SolusQuest/index.json --version 0.1.0-internal.1 --scenario scribe --require scribe
