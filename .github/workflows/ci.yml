name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Workflow mode"
        required: true
        default: ordinary-ci
        type: choice
        options:
          - ordinary-ci
          - host-validation-execution
      expected_head_sha:
        description: "Exact branch head required for Host Validation execution"
        required: false
        type: string
      pr_head_sha:
        description: "PR head SHA represented by this validation run"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ordinary-ci'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - run: dotnet restore ContractScribe.slnx
      - run: dotnet build ContractScribe.slnx --configuration Release --no-restore
      - name: Validate frozen M1 host-validation bundle
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- validate-bundle --root .
      - name: Dry-run M1 host-validation cell
        shell: pwsh
        run: |
          $cell = if ("${{ runner.os }}" -eq "Windows") { "windows-x64" } else { "ubuntu-x64" }
          dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- dry-run --root . --cell $cell
      - name: Self-test M1 host-validation harness
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- self-test --root .
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: SolusQuest/contract-scribe
          ref: 645c0946b8b811d633b471b232b0654c10e6d7f6
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Yuee98/contract-scribe-m07-fixture
          ref: aee85e30a7634fdf6adce7ac8b1a185a68b9698a
          path: fixture
          fetch-depth: 1
          persist-credentials: false
      - run: dotnet restore baseline/ContractScribe.slnx
      - run: dotnet build baseline/ContractScribe.slnx --configuration Release --no-restore
      - run: dotnet restore fixture/Sample.sln
      - run: dotnet build fixture/Sample.sln --configuration Release --no-restore
      - shell: pwsh
        working-directory: baseline
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/verify-m0.4.ps1 -Configuration Release
      - shell: pwsh
        working-directory: baseline
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/test-m0.4-provenance.ps1 -Configuration Release
      - shell: pwsh
        env:
          M07_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          M07_VALIDATION_MERGE_SHA: ${{ github.sha }}
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/verify-m0.7.ps1 -Configuration Release -BaselineRepositoryPath baseline -FixtureRepositoryPath fixture -BaselineCommit 645c0946b8b811d633b471b232b0654c10e6d7f6
      - shell: pwsh
        run: Get-Content -LiteralPath TestResults/m0.7-independent-validation/m0.7-evidence.json -Raw
      - shell: pwsh
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/test-m0.7-provenance.ps1 -Configuration Release -BaselineRepositoryPath baseline -FixtureRepositoryPath fixture -BaselineCommit 645c0946b8b811d633b471b232b0654c10e6d7f6
      - shell: pwsh
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/test-m0.7-failure-safety.ps1 -BaselineRepositoryPath baseline -BaselineCommit 645c0946b8b811d633b471b232b0654c10e6d7f6
      - shell: pwsh
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/test-m0.7-verifier-classification.ps1 -BaselineRepositoryPath baseline -FixtureRepositoryPath fixture
      - shell: pwsh
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/test-m0.7-public-artifact.ps1
      - shell: pwsh
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/test-m0.7-postrun-failure-safety.ps1
      - run: dotnet test ContractScribe.slnx --configuration Release --no-build --no-restore
      - run: dotnet format ContractScribe.slnx --verify-no-changes --no-restore
      - run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- --help
      - run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- --version
      - run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- doctor
      - shell: pwsh
        if: success()
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/prepare-m0.7-public-evidence.ps1 -SourceRoot TestResults/m0.7-independent-validation -PublicRoot TestResults/m0.7-public-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: m0.7-evidence-${{ matrix.os }}
          path: TestResults/m0.7-public-evidence
          if-no-files-found: error
      - shell: pwsh
        if: failure()
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/write-m0.7-postrun-failure-evidence.ps1 -OutputRoot TestResults/m0.7-independent-validation -BaselineCommit 645c0946b8b811d633b471b232b0654c10e6d7f6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: m0.7-evidence-failure-${{ matrix.os }}
          path: TestResults/m0.7-independent-validation/m0.7-failure-evidence.json
          if-no-files-found: ignore

  aggregate-m07:
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ordinary-ci')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: m0.7-evidence-*
          path: TestResults/m0.7-independent-validation
          merge-multiple: false
      - shell: pwsh
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          VALIDATION_MERGE_SHA: ${{ github.sha }}
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/aggregate-m0.7.ps1 -EvidenceRoot TestResults/m0.7-independent-validation -OutputPath TestResults/m0.7-independent-validation/m0.7-aggregate-evidence.json -ValidateResult $env:VALIDATE_RESULT -ExpectedPrHeadCommit $env:PR_HEAD_SHA -ExpectedValidationMergeCommit $env:VALIDATION_MERGE_SHA -ExpectedRunId $env:GITHUB_RUN_ID
      - shell: pwsh
        run: pwsh -NoProfile -File tests/ContractScribe.Roslyn.Experiment/test-m0.7-aggregate-outcomes.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0.7-aggregate-evidence
          path: TestResults/m0.7-independent-validation/m0.7-aggregate-evidence.json
          if-no-files-found: error

  host-validation-common:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'host-validation-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact requested head
        shell: pwsh
        run: |
          if ("${{ inputs.expected_head_sha }}" -notmatch '^[0-9a-f]{40}$') {
            throw 'expected_head_sha must be exactly 40 lowercase hexadecimal characters'
          }
          if ("${{ github.sha }}" -ne "${{ inputs.expected_head_sha }}") {
            throw 'workflow checkout does not match expected_head_sha'
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj
      - run: dotnet build tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-restore
      - name: Validate accepted content-bound bundle
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- validate-bundle --root . --require-review --review tests/fixtures/m1-host-validation/v1/independent-review.json
      - name: Materialize common source manifest
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- materialize-common --root . --review tests/fixtures/m1-host-validation/v1/independent-review.json --output TestResults/m1-host-validation/artifact-set/common-source-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-host-validation-common-source
          path: TestResults/m1-host-validation/artifact-set/common-source-manifest.json
          if-no-files-found: error

  host-validation-cell:
    needs: host-validation-common
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: ubuntu-x64
            os: ubuntu-latest
          - cell: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m1-host-validation-common-source
          path: TestResults/m1-host-validation/artifact-set
      - id: common-identity
        name: Read repository-owned common identity
        shell: pwsh
        run: |
          $common = Get-Content -LiteralPath TestResults/m1-host-validation/artifact-set/common-source-manifest.json -Raw | ConvertFrom-Json
          "source_revision=$($common.sourceConfiguration.hostRevision)" >> $env:GITHUB_OUTPUT
          "source_configuration_id=$($common.sourceConfiguration.sourceConfigurationId)" >> $env:GITHUB_OUTPUT
      - run: dotnet restore ContractScribe.slnx
      - run: dotnet build tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-restore
      - name: Build exact production subject
        run: dotnet build src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-restore -p:ContractScribeHostValidationSubject=true -p:ContractScribeSourceRevision=${{ steps.common-identity.outputs.source_revision }} -p:ContractScribeSourceConfigurationId=${{ steps.common-identity.outputs.source_configuration_id }}
      - name: Materialize cell subject manifest
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- materialize-cell --root . --review tests/fixtures/m1-host-validation/v1/independent-review.json --common-manifest TestResults/m1-host-validation/artifact-set/common-source-manifest.json --cell ${{ matrix.cell }} --output TestResults/m1-host-validation/artifact-set/${{ matrix.cell }}/cell-subject-manifest.json
      - name: Execute exact cell
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- execute-cell --root . --review tests/fixtures/m1-host-validation/v1/independent-review.json --common-manifest TestResults/m1-host-validation/artifact-set/common-source-manifest.json --cell-manifest TestResults/m1-host-validation/artifact-set/${{ matrix.cell }}/cell-subject-manifest.json --output TestResults/m1-host-validation/artifact-set/${{ matrix.cell }}/cell-evidence.json --incomplete-output TestResults/m1-host-validation/artifact-set/${{ matrix.cell }}/incomplete-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.cell }}
          path: TestResults/m1-host-validation/artifact-set/${{ matrix.cell }}
          if-no-files-found: error

  host-validation-aggregate:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'host-validation-execution'
    needs:
      - host-validation-common
      - host-validation-cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj
      - run: dotnet build tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m1-host-validation-common-source
          path: TestResults/m1-host-validation/artifact-set
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ubuntu-x64
          path: TestResults/m1-host-validation/artifact-set/ubuntu-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64
          path: TestResults/m1-host-validation/artifact-set/windows-x64
      - name: Aggregate exact artifact set
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- aggregate --root . --review tests/fixtures/m1-host-validation/v1/independent-review.json --artifact-root TestResults/m1-host-validation/artifact-set --publication-base-revision ${{ github.sha }} --output TestResults/m1-host-validation/aggregate-evidence.json
      - name: Prepare public-safe aggregate
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- prepare-public --root . --review tests/fixtures/m1-host-validation/v1/independent-review.json --artifact-root TestResults/m1-host-validation/artifact-set --kind aggregate --source TestResults/m1-host-validation/aggregate-evidence.json --output TestResults/m1-host-validation/public/aggregate-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m1-host-validation-aggregate
          path: TestResults/m1-host-validation/public/aggregate-evidence.json
          if-no-files-found: error
      - name: Require repository-validated passing aggregate
        run: dotnet run --project tests/ContractScribe.HostValidation/ContractScribe.HostValidation.csproj --configuration Release --no-build -- require-passing-aggregate --root . --review tests/fixtures/m1-host-validation/v1/independent-review.json --artifact-root TestResults/m1-host-validation/artifact-set --evidence TestResults/m1-host-validation/aggregate-evidence.json
