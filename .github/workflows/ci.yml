          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Render next activation
        id: activation
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
          CS_RUN_CONTEXT: '{"runId":91001,"runNumber":500,"runAttempt":1,"event":"workflow_dispatch","ref":"refs/heads/main","sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: >-
          python3 action-src/examples/github-actions/handoff.py activation
          --handoff-dir "$RUNNER_TEMP/cs-handoff"
          --artifact-id "${{ steps.handoff_upload.outputs.artifact-id }}"
          --artifact-digest "${{ steps.handoff_upload.outputs.artifact-digest }}"
      - name: Assert producer-side facts
        shell: bash
        env:
          OUTCOME: ${{ steps.invoke.outputs.outcome }}
          STATUS: ${{ steps.invoke.outputs.action-status }}
        run: |
          set -euo pipefail
          [ "$STATUS" = ok ]
          [ "$OUTCOME" = github-proposal.published ]
          grep -q "POST /repos/Owner/repo/pulls" fakes/github.log
          test -s fakes/github-state.json
          test -s producer-obs.txt && grep -q token-read producer-obs.txt
      - name: Upload diagnostics (includes synthetic GitHub state)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a3-producer-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            fakes/
            action-inputs/
            producer-obs.txt
          if-no-files-found: warn

  action_examples_consumer:
    # M6-A3: consumer leg — a fresh runner authenticates the caller
    # activation + sealed artifact, downloads it natively, restores the
    # checkpoint privately, and replays the operation through the real CLI.
    needs: action_examples_producer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          path: action-src
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: packaging-test-kit-attempt-${{ github.run_attempt }}
          path: kit
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: d2-payload-attempt-${{ github.run_attempt }}
          path: producer-payload
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: a3-producer-diagnostics-attempt-${{ github.run_attempt }}
          path: producer-diagnostics
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: kit/global.json
      - name: Rebuild the identical target fixture
        id: target
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.action_examples_producer.outputs.target_head }}
        run: |
          set -euo pipefail
          TGT="$PWD/target-repo-a3"
          mkdir -p "$TGT"
          cp -r kit/fixture/. "$TGT/"
          cp kit/global.json "$TGT/global.json"
          git -C "$TGT" init -q -b main
          git -C "$TGT" config user.email fixture@example.invalid
          git -C "$TGT" config user.name Fixture
          git -C "$TGT" add '*.cs' '*.csproj' '*.slnx' 'policy.json' \
              'global.json' 'NuGet.Config'
          GIT_AUTHOR_DATE='2026-01-01T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-01-01T00:00:00Z' \
              git -C "$TGT" commit -qm 'fixture base'
          TARGET_HEAD="$(git -C "$TGT" rev-parse HEAD)"
          [ "$TARGET_HEAD" = "$EXPECTED_HEAD" ]
          echo "target_head=$TARGET_HEAD" >> "$GITHUB_OUTPUT"
          (cd "$TGT" && dotnet restore Fixture.slnx --nologo >/dev/null \
              && dotnet build Fixture.slnx --no-restore --nologo >/dev/null)
      - name: Start loopback fakes (GitHub state hydrated from producer)
        id: fakes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fakes
          python3 - fakes <<'PYEOF'
          import glob, hashlib, json, sys
          archive = glob.glob("producer-payload/**/*.tar.gz", recursive=True)[0]
          manifest = json.load(open(archive[:-7] + ".payload.json"))
          sha = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          asset = archive.rsplit("/", 1)[-1]
          test_map = {"mapVersion": 1, "wrapper": "contract-scribe-action",
              "payload": {"repository": "SolusQuest/contract-scribe",
                  "releaseTag": "payload-" + manifest["toolVersion"],
                  "toolVersion": manifest["toolVersion"],
                  "sourceRevision": manifest["sourceRevision"],
                  "runtimeIdentifier": "linux-x64",
                  "assetName": asset,
                  "sha256": sha,
                  "assets": [asset]}}
          json.dump(test_map, open(sys.argv[1] + "/test-map.json", "w"))
          m = test_map["payload"]
          cfg = {"repository": m["repository"],
                 "expected_token": "contract-scribe-synthetic-acquisition-only",
                 "require_auth": False,
                 "releases": [{"id": 1, "tag": m["releaseTag"], "draft": False,
                     "assets": [{"id": 1, "name": m["assetName"],
                                 "file": archive}]}],
                 "overrides": {}}
          json.dump(cfg, open(sys.argv[1] + "/release-config.json", "w"))
          PYEOF
          STATE_FILE="$(find producer-diagnostics -name github-state.json | head -1)"
          [ -n "$STATE_FILE" ] && [ -f "$STATE_FILE" ]
          python3 - "$STATE_FILE" <<'PYEOF'
          import json, sys
          gh = {"repository": "Owner/repo",
                "load_state": sys.argv[1],
                "state_file": "fakes/github-state.json"}
          json.dump(gh, open("fakes/github-config.json", "w"))
          PYEOF
          touch fakes/release.log fakes/provider.log fakes/github.log \
              fakes/github-failures.log fakes/actions.log
          python3 action-src/tests/action/fake_release_api.py \
              fakes/release-config.json fakes/release-ready.json fakes/release.log &
          python3 action-src/tests/action/fake_provider.py proposal \
              fakes/provider-ready.json fakes/provider.log &
          python3 action-src/tests/action-workflows/fake_github_state.py \
              fakes/github-config.json fakes/github-ready.json \
              fakes/github.log fakes/github-failures.log &
          python3 action-src/tests/action-workflows/fake_actions_api.py \
              fakes/actions-config.json fakes/actions-ready.json \
              fakes/actions.log &
          for f in release provider github actions; do
            for _ in $(seq 100); do [ -f "fakes/$f-ready.json" ] && break; sleep 0.1; done
            [ -f "fakes/$f-ready.json" ]
          done
          {
            echo "api_root=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["api"])' fakes/release-ready.json)"
            echo "provider=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["endpoint"])' fakes/provider-ready.json)"
            echo "github=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["endpoint"])' fakes/github-ready.json)"
            echo "actions_api=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["endpoint"])' fakes/actions-ready.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Seed Actions metadata for consumer leg 1
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.action_examples_producer.outputs.handoff_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.action_examples_producer.outputs.handoff_artifact_digest }}
        run: |
          set -euo pipefail
          python3 - "$ARTIFACT_ID" "$ARTIFACT_DIGEST" <<'PYEOF'
          import json, sys
          aid, digest = int(sys.argv[1]), sys.argv[2]
          actions = {
            "repository": {"id": 7001, "full_name": "Owner/repo",
                           "default_branch": "main"},
            "expected_token": "contract-scribe-synthetic-actions-read",
            "runs": {
              "91001": {"id": 91001, "run_number": 500, "run_attempt": 1,
                "event": "workflow_dispatch", "status": "completed",
                "conclusion": "success", "head_branch": "main",
                "head_sha": "b" * 40, "workflow_id": 55,
                "path": ".github/workflows/contract-scribe-campaign.yml",
                "repository": {"id": 7001, "full_name": "Owner/repo"},
                "head_repository": {"id": 7001}},
              "92002": {"id": 92002, "run_number": 501, "run_attempt": 1,
                "event": "schedule", "status": "in_progress",
                "conclusion": None, "head_branch": "main",
                "head_sha": "c" * 40, "workflow_id": 55,
                "path": ".github/workflows/contract-scribe-campaign.yml",
                "repository": {"id": 7001, "full_name": "Owner/repo"},
                "head_repository": {"id": 7001}}},
            "artifacts": {str(aid): {
                "id": aid, "name": "contract-scribe-handoff",
                "size_in_bytes": 4096, "expired": False,
                "expires_at": "2099-01-01T00:00:00Z",
                "digest": "sha256:" + digest,
                "workflow_run": {"id": 91001, "repository_id": 7001,
                                 "head_repository_id": 7001,
                                 "head_branch": "main",
                                 "head_sha": "b" * 40}}},
            "run_artifacts": {"91001": [aid]}}
          json.dump(actions, open("fakes/actions-config.json", "w"))
          PYEOF
      - name: Prepare layer for resumes
        env:
          PROVIDER: ${{ steps.fakes.outputs.provider }}
        run: |
          set -euo pipefail
          mkdir -p action-inputs
          cat > action-inputs/layer.json <<EOFX
          {"consumerConfigurationVersion":1,
           "provider":{"endpoint":"$PROVIDER","model":"fixture-model",
             "requestProfile":{"toolChoice":"auto"}},
           "budgets":{"campaign":{"maximumCandidatesPerBlock":30,
             "maximumElapsedMilliseconds":3600000}}}
          EOFX
      - name: "Consumer leg 1 — authenticate activation"
        id: select
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
          CS_ACTIVATION: ${{ needs.action_examples_producer.outputs.activation_json }}
          CS_RUN_CONTEXT: '{"runId":92002,"runNumber":501,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"cccccccccccccccccccccccccccccccccccccccc","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: python3 action-src/examples/github-actions/handoff.py select --workdir "$RUNNER_TEMP/cs-select"
      - name: "Consumer leg 1 — download handoff (native transport)"
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          # Physical identity substitution: all test artifacts live on this
          # CI run, so run-id defaults to the current run. The logical
          # producer binding is still enforced through artifact-ids + the
          # authenticated metadata + digest. Production wires
          # steps.select.outputs.producer-run-id instead.
          artifact-ids: ${{ steps.select.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cs-download
