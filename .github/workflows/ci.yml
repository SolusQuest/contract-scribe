              "snapshot": "snapshot.action.a3",
              "operationId": "operation.a3",
              "generationId": "generation.a3",
              "targetRef": "refs/heads/main",
              "repositoryOwner": "Owner",
              "repositoryName": "repo",
              "policyCeilings": {"maximumDocumentationBlocks": 128,
                                 "maximumDistinctChangedFiles": 128,
                                 "maximumCumulativePatchBytes": 4194304}}
          json.dump(campaign, open("action-inputs/campaign.json", "w"))
          context = {"runId": 91001, "runNumber": 500, "runAttempt": 1,
                     "event": "workflow_dispatch", "ref": "refs/heads/main",
                     "sha": "b" * 40, "repository": "Owner/repo",
                     "repositoryId": 7001,
                     "workflowRef": "Owner/repo/.github/workflows/"
                                    "contract-scribe-campaign.yml@refs/heads/main"}
          json.dump(context, open("action-inputs/context.json", "w"))
          print("state=" + sys.argv[1])
          PYEOF
      - name: Producer admission gate
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
          CS_RUN_CONTEXT: '{"runId":91001,"runNumber":500,"runAttempt":1,"event":"workflow_dispatch","ref":"refs/heads/main","sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: python3 action-src/examples/github-actions/handoff.py gate
      - name: Build invocation request
        id: request
        env:
          CS_CAMPAIGN_LINEAGE: campaign.action.a3
          CS_CAMPAIGN: '{"snapshot":"snapshot.action.a3","operationId":"operation.a3","generationId":"generation.a3","targetRef":"refs/heads/main","repositoryOwner":"Owner","repositoryName":"repo","policyCeilings":{"maximumDocumentationBlocks":128,"maximumDistinctChangedFiles":128,"maximumCumulativePatchBytes":4194304}}'
          CS_RUN_CONTEXT: '{"runId":91001,"runNumber":500,"runAttempt":1,"event":"workflow_dispatch","ref":"refs/heads/main","sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: >-
          python3 action-src/examples/github-actions/handoff.py request
          --base-oid "${{ steps.target.outputs.target_head }}"
          --state "$RUNNER_TEMP/cs-state/checkpoint.json"
          --out "$RUNNER_TEMP/cs-request.json"
      - name: "E2E start through uses (producer)"
        id: invoke
        uses: ./action-src
        env:
          CONTRACTSCRIBE_ACTION_TEST: "1"
          CONTRACTSCRIBE_ACTION_TEST_API_ROOT: ${{ steps.fakes.outputs.api_root }}
          CONTRACTSCRIBE_ACTION_TEST_MAP: ${{ github.workspace }}/fakes/test-map.json
          DOTNET_STARTUP_HOOKS: ${{ github.workspace }}/kit/hook/ContractScribe.CampaignStartupHook.dll
          CONTRACTSCRIBE_TEST_GITHUB_ENDPOINT: ${{ steps.fakes.outputs.github }}
          CONTRACTSCRIBE_TEST_GITHUB_OBSERVATIONS: ${{ github.workspace }}/producer-obs.txt
        with:
          operation: github-proposal-start
          repository-root: ${{ github.workspace }}/target-repo-a3
          input: Fixture.slnx
          policy: policy.json
          request: ${{ steps.request.outputs.request-json }}
          configuration: ${{ github.workspace }}/action-inputs/layer.json
          provider-api-key: contract-scribe-synthetic-provider-only
          github-token: contract-scribe-synthetic-transport-only
          acquisition-token: contract-scribe-synthetic-acquisition-only
      - name: Emit sealed handoff
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
          CS_RUN_CONTEXT: '{"runId":91001,"runNumber":500,"runAttempt":1,"event":"workflow_dispatch","ref":"refs/heads/main","sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: >-
          python3 action-src/examples/github-actions/handoff.py emit
          --checkpoint "$RUNNER_TEMP/cs-state/checkpoint.json"
          --handoff-dir "$RUNNER_TEMP/cs-handoff"
      - name: Upload producer handoff (physical CI name)
        id: handoff_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
