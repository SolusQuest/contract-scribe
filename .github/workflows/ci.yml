        id: activation1
        env:
          CS_RUN_CONTEXT: '{"runId":92002,"runNumber":501,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"cccccccccccccccccccccccccccccccccccccccc","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: >-
          python3 action-src/examples/github-actions/handoff.py activation
          --handoff-dir "$RUNNER_TEMP/cs-handoff-1"
          --artifact-id "${{ steps.successor_upload.outputs.artifact-id }}"
          --artifact-digest "${{ steps.successor_upload.outputs.artifact-digest }}"
      - name: Assert leg-1 replayed outcome
        shell: bash
        env:
          OUTCOME: ${{ steps.invoke.outputs.outcome }}
          STATUS: ${{ steps.invoke.outputs.action-status }}
        run: |
          set -euo pipefail
          [ "$STATUS" = ok ]
          [ "$OUTCOME" = github-proposal.replayed ]
      - name: "Consumer leg 2 — consume the successor (synthetic K+2)"
        id: leg2
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
        run: |
          set -euo pipefail
          # The consumer run becomes the producer of S; the fake presents
          # run 92002 (synthetic number 501, concluded success) as the
          # producer and 93003/502 as the current consumer.
          python3 - "${{ steps.successor_upload.outputs.artifact-id }}" \
                    "${{ steps.successor_upload.outputs.artifact-digest }}" <<'PYEOF'
          import json, sys
          aid, digest = int(sys.argv[1]), sys.argv[2]
          cfg = json.load(open("fakes/actions-config.json"))
          cfg["runs"]["92002"].update({"status": "completed",
                                       "conclusion": "success"})
          cfg["runs"]["93003"] = {
              "id": 93003, "run_number": 502, "run_attempt": 1,
              "event": "schedule", "status": "in_progress",
              "conclusion": None, "head_branch": "main",
              "head_sha": "d" * 40, "workflow_id": 55,
              "path": ".github/workflows/contract-scribe-campaign.yml",
              "repository": {"id": 7001, "full_name": "Owner/repo"},
              "head_repository": {"id": 7001}}
          cfg["artifacts"][str(aid)] = {
              "id": aid, "name": "contract-scribe-handoff",
              "size_in_bytes": 4096, "expired": False,
              "expires_at": "2099-01-01T00:00:00Z",
              "digest": "sha256:" + digest,
              "workflow_run": {"id": 92002, "repository_id": 7001,
                               "head_repository_id": 7001,
                               "head_branch": "main", "head_sha": "c" * 40}}
          cfg["run_artifacts"] = {"92002": [aid]}
          json.dump(cfg, open("fakes/actions-config.json", "w"))
          PYEOF
      - name: "Consumer leg 2 — authenticate activation"
        id: select2
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
          CS_ACTIVATION: ${{ steps.activation1.outputs.activation-json }}
          CS_RUN_CONTEXT: '{"runId":93003,"runNumber":502,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"dddddddddddddddddddddddddddddddddddddddd","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: |
          set -euo pipefail
          python3 action-src/examples/github-actions/handoff.py select \
              --workdir "$RUNNER_TEMP/cs-select-2"
      - name: "Consumer leg 2 — download successor (native transport)"
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: ${{ steps.select2.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cs-download-2
          skip-decompress: true
          digest-mismatch: error
      - name: "Consumer leg 2 — verify + restore checkpoint"
        env:
          CS_RUN_CONTEXT: '{"runId":93003,"runNumber":502,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"dddddddddddddddddddddddddddddddddddddddd","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: |
          set -euo pipefail
          ZIP="$(find "$RUNNER_TEMP/cs-download-2" -name '*.zip' | head -1)"
          [ -n "$ZIP" ] && [ -f "$ZIP" ]
          python3 action-src/examples/github-actions/handoff.py verify \
              --archive "$ZIP" \
              --selection "$RUNNER_TEMP/cs-select-2/selection.json" \
              --state-dir "$RUNNER_TEMP/cs-state-2"
      - name: "Consumer leg 2 — build request + resume"
        id: request2
        env:
          CS_CAMPAIGN_LINEAGE: campaign.action.a3
          CS_CAMPAIGN: '{"snapshot":"snapshot.action.a3","operationId":"operation.a3","generationId":"generation.a3","targetRef":"refs/heads/main","repositoryOwner":"Owner","repositoryName":"repo","policyCeilings":{"maximumDocumentationBlocks":128,"maximumDistinctChangedFiles":128,"maximumCumulativePatchBytes":4194304}}'
          CS_RUN_CONTEXT: '{"runId":93003,"runNumber":502,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"dddddddddddddddddddddddddddddddddddddddd","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: >-
          python3 action-src/examples/github-actions/handoff.py request
          --base-oid "${{ steps.target.outputs.target_head }}"
          --state "$RUNNER_TEMP/cs-state-2/checkpoint.json"
          --out "$RUNNER_TEMP/cs-request-2.json"
      - name: "Consumer leg 2 — resume through uses"
        id: invoke2
        uses: ./action-src
        env:
          CONTRACTSCRIBE_ACTION_TEST: "1"
          CONTRACTSCRIBE_ACTION_TEST_API_ROOT: ${{ steps.fakes.outputs.api_root }}
          CONTRACTSCRIBE_ACTION_TEST_MAP: ${{ github.workspace }}/fakes/test-map.json
          DOTNET_STARTUP_HOOKS: ${{ github.workspace }}/kit/hook/ContractScribe.CampaignStartupHook.dll
          CONTRACTSCRIBE_TEST_GITHUB_ENDPOINT: ${{ steps.fakes.outputs.github }}
          CONTRACTSCRIBE_TEST_GITHUB_OBSERVATIONS: ${{ github.workspace }}/consumer2-obs.txt
        with:
          operation: github-proposal-resume
          repository-root: ${{ github.workspace }}/target-repo-a3
          input: Fixture.slnx
          policy: policy.json
          request: ${{ steps.request2.outputs.request-json }}
          configuration: ${{ github.workspace }}/action-inputs/layer.json
          provider-api-key: contract-scribe-synthetic-provider-only
          github-token: contract-scribe-synthetic-transport-only
          acquisition-token: contract-scribe-synthetic-acquisition-only
      - name: Assert leg-2 replayed outcome
        shell: bash
        env:
          OUTCOME: ${{ steps.invoke2.outputs.outcome }}
          STATUS: ${{ steps.invoke2.outputs.action-status }}
        run: |
          set -euo pipefail
          [ "$STATUS" = ok ]
          # Post-replay state may report replayed/no-op/awaiting-review;
          # all are exit-0 replay evidence — the chain consumed S.
          case "$OUTCOME" in
            github-proposal.replayed|github-proposal.no-op|github-proposal.awaiting-review) ;;
            *) echo "unexpected outcome: $OUTCOME"; exit 1;;
          esac
      - name: "Invalid-checkpoint leg — corrupt state rejects before credentials"
        id: bad_leg
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
        run: |
          set -euo pipefail
          # A structurally-valid handoff directory carrying bytes that are
          # not a Campaign State — upload-artifact wraps it exactly as the
          # production emit path, and the CLI must reject the restored
          # checkpoint at admission (exit 4) before privileged execution.
          python3 - <<'PYEOF'
          import hashlib, json, os
          os.makedirs("bad-handoff", exist_ok=True)
          checkpoint = b'{"not":"campaign-state"}'
          handoff = {
            "producer": {"repositoryId": 7001, "repository": "Owner/repo",
              "workflowId": 55,
              "workflowPath": ".github/workflows/contract-scribe-campaign.yml",
              "runId": 94004, "runNumber": 503, "runAttempt": 1,
              "event": "workflow_dispatch", "headRef": "refs/heads/main",
              "headSha": "b" * 40},
            "checkpoint": {"sha256": hashlib.sha256(checkpoint).hexdigest(),
                           "bytes": len(checkpoint)},
            "consumer": {"repositoryId": 7001, "repository": "Owner/repo",
              "workflowId": 55, "runNumber": 504, "event": "schedule"}}
          with open("bad-handoff/handoff.json", "w") as fh:
              fh.write(json.dumps(handoff))
          with open("bad-handoff/checkpoint.json", "wb") as fh:
              fh.write(checkpoint)
          PYEOF
      - name: "Invalid-checkpoint leg — upload artifact"
        id: bad_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a3-handoff-bad-attempt-${{ github.run_attempt }}
          path: bad-handoff/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: "Invalid-checkpoint leg — configure metadata"
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
        run: |
          set -euo pipefail
          AID="${{ steps.bad_upload.outputs.artifact-id }}"
          DIGEST="${{ steps.bad_upload.outputs.artifact-digest }}"
          python3 - "$AID" "$DIGEST" <<'PYEOF'
          import json, sys
          aid, digest = int(sys.argv[1]), sys.argv[2]
          cfg = json.load(open("fakes/actions-config.json"))
          cfg["runs"]["94004"] = {
              "id": 94004, "run_number": 503, "run_attempt": 1,
              "event": "workflow_dispatch", "status": "completed",
              "conclusion": "success", "head_branch": "main",
              "head_sha": "b" * 40, "workflow_id": 55,
              "path": ".github/workflows/contract-scribe-campaign.yml",
              "repository": {"id": 7001, "full_name": "Owner/repo"},
              "head_repository": {"id": 7001}}
          cfg["runs"]["95005"] = {
              "id": 95005, "run_number": 504, "run_attempt": 1,
              "event": "schedule", "status": "in_progress",
              "conclusion": None, "head_branch": "main",
              "head_sha": "d" * 40, "workflow_id": 55,
              "path": ".github/workflows/contract-scribe-campaign.yml",
              "repository": {"id": 7001, "full_name": "Owner/repo"},
              "head_repository": {"id": 7001}}
          cfg["artifacts"][str(aid)] = {
              "id": aid, "name": "contract-scribe-handoff",
              "size_in_bytes": 4096, "expired": False,
              "expires_at": "2099-01-01T00:00:00Z",
              "digest": "sha256:" + digest,
              "workflow_run": {"id": 94004, "repository_id": 7001,
                               "head_repository_id": 7001,
                               "head_branch": "main", "head_sha": "b" * 40}}
          cfg["run_artifacts"] = {"94004": [aid]}
          json.dump(cfg, open("fakes/actions-config.json", "w"))
          print(json.dumps({"producer": {"runId": 94004, "runNumber": 503,
                "runAttempt": 1, "artifactId": aid,
                "artifactDigest": "sha256:" + digest},
              "consumer": {"runNumber": 504, "event": "schedule"}}),
                file=open("bad-activation.json", "w"))
          PYEOF
      - name: "Invalid-checkpoint leg — authenticate activation"
        id: select_bad
        env:
          CS_ACTIONS_API_URL: ${{ steps.fakes.outputs.actions_api }}
          GITHUB_TOKEN: contract-scribe-synthetic-actions-read
          CS_RUN_CONTEXT: '{"runId":95005,"runNumber":504,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"dddddddddddddddddddddddddddddddddddddddd","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: |
          set -euo pipefail
          export CS_ACTIVATION="$(cat bad-activation.json)"
          python3 action-src/examples/github-actions/handoff.py select \
              --workdir "$RUNNER_TEMP/cs-select-bad"
      - name: "Invalid-checkpoint leg — native download"
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: ${{ steps.select_bad.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cs-download-bad
          skip-decompress: true
          digest-mismatch: error
      - name: "Invalid-checkpoint leg — verify restores bytes"
        env:
          CS_RUN_CONTEXT: '{"runId":95005,"runNumber":504,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"dddddddddddddddddddddddddddddddddddddddd","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: |
          set -euo pipefail
          ZIP="$(find "$RUNNER_TEMP/cs-download-bad" -name '*.zip' | head -1)"
          [ -n "$ZIP" ] && [ -f "$ZIP" ]
          python3 action-src/examples/github-actions/handoff.py verify \
              --archive "$ZIP" \
              --selection "$RUNNER_TEMP/cs-select-bad/selection.json" \
              --state-dir "$RUNNER_TEMP/cs-state-bad"
          wc -l < fakes/provider.log > provider-lines-before.txt
          wc -l < fakes/github.log > github-lines-before.txt
      - name: "Invalid-checkpoint leg — build request"
        id: bad_request
        env:
          CS_CAMPAIGN_LINEAGE: campaign.action.a3
          CS_CAMPAIGN: '{"snapshot":"snapshot.action.a3","operationId":"operation.a3","generationId":"generation.a3","targetRef":"refs/heads/main","repositoryOwner":"Owner","repositoryName":"repo","policyCeilings":{"maximumDocumentationBlocks":128,"maximumDistinctChangedFiles":128,"maximumCumulativePatchBytes":4194304}}'
          CS_RUN_CONTEXT: '{"runId":95005,"runNumber":504,"runAttempt":1,"event":"schedule","ref":"refs/heads/main","sha":"dddddddddddddddddddddddddddddddddddddddd","repository":"Owner/repo","repositoryId":7001,"workflowRef":"Owner/repo/.github/workflows/contract-scribe-campaign.yml@refs/heads/main"}'
        run: >-
          python3 action-src/examples/github-actions/handoff.py request
          --base-oid "${{ steps.target.outputs.target_head }}"
          --state "$RUNNER_TEMP/cs-state-bad/checkpoint.json"
          --out "$RUNNER_TEMP/cs-request-bad.json"
      - name: "Invalid-checkpoint leg — request + resume fails at admission"
        id: bad_invoke
        continue-on-error: true
        uses: ./action-src
        env:
          CONTRACTSCRIBE_ACTION_TEST: "1"
          CONTRACTSCRIBE_ACTION_TEST_API_ROOT: ${{ steps.fakes.outputs.api_root }}
          CONTRACTSCRIBE_ACTION_TEST_MAP: ${{ github.workspace }}/fakes/test-map.json
          DOTNET_STARTUP_HOOKS: ${{ github.workspace }}/kit/hook/ContractScribe.CampaignStartupHook.dll
          CONTRACTSCRIBE_TEST_GITHUB_ENDPOINT: ${{ steps.fakes.outputs.github }}
          CONTRACTSCRIBE_TEST_GITHUB_OBSERVATIONS: ${{ github.workspace }}/bad-obs.txt
        with:
          operation: github-proposal-resume
          repository-root: ${{ github.workspace }}/target-repo-a3
          input: Fixture.slnx
          policy: policy.json
          request: ${{ steps.bad_request.outputs.request-json }}
          configuration: ${{ github.workspace }}/action-inputs/layer.json
          provider-api-key: contract-scribe-synthetic-provider-only
          github-token: contract-scribe-synthetic-transport-only
          acquisition-token: contract-scribe-synthetic-acquisition-only
      - name: Assert invalid-checkpoint stop
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.bad_invoke.outcome }}
          OUTCOME: ${{ steps.bad_invoke.outputs.outcome }}
          EXIT_CODE: ${{ steps.bad_invoke.outputs.exit-code }}
          STATUS: ${{ steps.bad_invoke.outputs.action-status }}
        run: |
          set -euo pipefail
          [ "$STEP_OUTCOME" = failure ]
          [ "$STATUS" = ok ]
          [ "$EXIT_CODE" = 4 ]
          case "$OUTCOME" in github-proposal.*) ;; *) exit 1;; esac
          # The corrupt checkpoint was rejected before privileged product
          # execution: zero new provider requests, zero new GitHub requests,
          # zero token reads for this invocation.
          [ "$(wc -l < fakes/provider.log)" = "$(cat provider-lines-before.txt)" ]
          [ "$(wc -l < fakes/github.log)" = "$(cat github-lines-before.txt)" ]
          ! test -s bad-obs.txt || ! grep -q token-read bad-obs.txt
      - name: Functional leg matrix (same as local verify)
        id: legs
        continue-on-error: true
        env:
          HANDOFF_PY: ${{ github.workspace }}/action-src/examples/github-actions/handoff.py
          FAKE_API_PY: ${{ github.workspace }}/action-src/tests/action-workflows/fake_actions_api.py
        run: |
          set -euo pipefail
          python3 action-src/tests/action-workflows/driver.py run \
              "$RUNNER_TEMP/a3-legs"
      - name: Upload consumer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a3-consumer-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            fakes/
            action-inputs/
            consumer-obs.txt
            consumer2-obs.txt
            bad-obs.txt
            bad-activation.json
          if-no-files-found: warn
      - name: Aggregate action-workflow outcomes
        if: always()
        shell: pwsh
        env:
          L1: ${{ steps.invoke.outcome }}
          L2: ${{ steps.invoke2.outcome }}
          LEGS: ${{ steps.legs.outcome }}
        run: |
          if ($env:L1 -ne 'success' -or $env:L2 -ne 'success' `
              -or $env:LEGS -ne 'success') {
            throw "action_examples_consumer failure: leg1=$env:L1 leg2=$env:L2 legs=$env:LEGS"
          }

  validate:
    if: always()
    needs:
      - fast_and_static
      - integration_campaign_crash
      - integration_remaining
      - payload_producer
      - packed_payload
      - action_packaged
      - action_examples_producer
      - action_examples_consumer
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required CI jobs
        shell: pwsh
        env:
          FAST_AND_STATIC_RESULT: ${{ needs.fast_and_static.result }}
          CAMPAIGN_CRASH_RESULT: ${{ needs.integration_campaign_crash.result }}
          REMAINING_INTEGRATION_RESULT: ${{ needs.integration_remaining.result }}
          PAYLOAD_PRODUCER_RESULT: ${{ needs.payload_producer.result }}
          PACKED_PAYLOAD_RESULT: ${{ needs.packed_payload.result }}
          ACTION_PACKAGED_RESULT: ${{ needs.action_packaged.result }}
          A3_PRODUCER_RESULT: ${{ needs.action_examples_producer.result }}
          A3_CONSUMER_RESULT: ${{ needs.action_examples_consumer.result }}
        run: |
          $results = @{
            fast_and_static = $env:FAST_AND_STATIC_RESULT
            integration_campaign_crash = $env:CAMPAIGN_CRASH_RESULT
            integration_remaining = $env:REMAINING_INTEGRATION_RESULT
            payload_producer = $env:PAYLOAD_PRODUCER_RESULT
            packed_payload = $env:PACKED_PAYLOAD_RESULT
            action_packaged = $env:ACTION_PACKAGED_RESULT
            action_examples_producer = $env:A3_PRODUCER_RESULT
            action_examples_consumer = $env:A3_CONSUMER_RESULT
          }
          $failures = @($results.GetEnumerator() | Where-Object Value -ne 'success' | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($failures.Count -gt 0) {
            throw "Required CI job failure: $($failures -join ', ')."
          }
