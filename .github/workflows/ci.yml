name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_unfiltered_evidence:
        description: Run the complete integration suite as additional partition-equivalence evidence
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast_and_static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact workflow head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected workflow head $env:EXPECTED_SHA but checked out $actual."
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Record runner, toolchain, and concurrency facts
        shell: pwsh
        env:
          CI_CONCURRENCY_GROUP: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
          CI_CANCEL_IN_PROGRESS: ${{ github.event_name == 'pull_request' }}
        run: |
          Write-Output "runner.os=$env:RUNNER_OS"
          Write-Output "runner.arch=$env:RUNNER_ARCH"
          Write-Output "runner.image.os=$env:ImageOS"
          Write-Output "runner.image.version=$env:ImageVersion"
          Write-Output "ci.concurrency.group=$env:CI_CONCURRENCY_GROUP"
          Write-Output "ci.concurrency.cancel-in-progress=$env:CI_CANCEL_IN_PROGRESS"
          dotnet --info
          dotnet msbuild -version
      - name: Restore
        run: dotnet restore ContractScribe.slnx
      - name: Build
        id: build
        run: dotnet build ContractScribe.slnx --configuration Release --no-restore
      - name: Fast suite
        id: fast_tests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet test tests/ContractScribe.Tests/ContractScribe.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFilePrefix=fast-${{ runner.os }}"
          --results-directory TestResults/ci/fast
      - name: Require discovered fast tests
        id: fast_test_count
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path TestResults/ci/fast -Filter *.trx -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            throw "The fast-suite command produced no TRX file."
          }
          [xml] $trx = Get-Content -Raw -LiteralPath $files[0].FullName
          $total = [int] $trx.TestRun.ResultSummary.Counters.total
          if ($total -le 0) {
            throw "The fast-suite filter discovered zero tests."
          }
          Write-Output "fast.tests.total=$total"
      - name: Verify formatting
        id: formatting
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet format ContractScribe.slnx --verify-no-changes --no-restore
      - name: CLI help smoke
        id: cli_help
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- --help
      - name: CLI version smoke
        id: cli_version
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- --version
      - name: CLI doctor smoke
        id: cli_doctor
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- doctor
      - name: Upload fast-suite TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-trx-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: TestResults/ci/fast/*.trx
          if-no-files-found: error
      - name: Aggregate fast and static outcomes
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          FAST_OUTCOME: ${{ steps.fast_tests.outcome }}
          FAST_COUNT_OUTCOME: ${{ steps.fast_test_count.outcome }}
          FORMATTING_OUTCOME: ${{ steps.formatting.outcome }}
          CLI_HELP_OUTCOME: ${{ steps.cli_help.outcome }}
          CLI_VERSION_OUTCOME: ${{ steps.cli_version.outcome }}
          CLI_DOCTOR_OUTCOME: ${{ steps.cli_doctor.outcome }}
        run: |
          $outcomes = @{
            build = $env:BUILD_OUTCOME
            fast = $env:FAST_OUTCOME
            fast_count = $env:FAST_COUNT_OUTCOME
            formatting = $env:FORMATTING_OUTCOME
            cli_help = $env:CLI_HELP_OUTCOME
            cli_version = $env:CLI_VERSION_OUTCOME
            cli_doctor = $env:CLI_DOCTOR_OUTCOME
          }
          $failures = @($outcomes.GetEnumerator() | Where-Object Value -ne 'success' | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($failures.Count -gt 0) {
            throw "Fast/static validation failure: $($failures -join ', ')."
          }

  integration_campaign_crash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact workflow head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected workflow head $env:EXPECTED_SHA but checked out $actual."
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Record runner, toolchain, and concurrency facts
        shell: pwsh
        env:
          CI_CONCURRENCY_GROUP: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
          CI_CANCEL_IN_PROGRESS: ${{ github.event_name == 'pull_request' }}
        run: |
          Write-Output "runner.os=$env:RUNNER_OS"
          Write-Output "runner.arch=$env:RUNNER_ARCH"
          Write-Output "runner.image.os=$env:ImageOS"
          Write-Output "runner.image.version=$env:ImageVersion"
          Write-Output "ci.concurrency.group=$env:CI_CONCURRENCY_GROUP"
          Write-Output "ci.concurrency.cancel-in-progress=$env:CI_CANCEL_IN_PROGRESS"
          dotnet --info
          dotnet msbuild -version
      - name: Restore
        run: dotnet restore ContractScribe.slnx
      - name: Build
        id: build
        run: dotnet build ContractScribe.slnx --configuration Release --no-restore
      - name: Campaign crash-boundary partition
        id: integration_tests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        run: >-
          dotnet test tests/ContractScribe.IntegrationTests/ContractScribe.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName=ContractScribe.Roslyn.IntegrationTests.CampaignCliProcessTests.EveryFrozenBoundary_IsAcknowledgedTerminatedAndReinvokedAgainstTheSameCheckpoint"
          --logger "trx;LogFilePrefix=integration-campaign-crash-${{ runner.os }}"
          --results-directory TestResults/ci/integration-campaign-crash
      - name: Require discovered campaign crash-boundary tests
        id: integration_test_count
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path TestResults/ci/integration-campaign-crash -Filter *.trx -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            throw "The campaign crash-boundary command produced no TRX file."
          }
          [xml] $trx = Get-Content -Raw -LiteralPath $files[0].FullName
          $total = [int] $trx.TestRun.ResultSummary.Counters.total
          if ($total -le 0) {
            throw "The campaign crash-boundary filter discovered zero tests."
          }
          Write-Output "integration.campaign-crash.tests.total=$total"
      - name: Upload campaign crash-boundary TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-campaign-crash-trx-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: TestResults/ci/integration-campaign-crash/*.trx
          if-no-files-found: error
      - name: Aggregate campaign crash-boundary outcomes
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.integration_tests.outcome }}
          TEST_COUNT_OUTCOME: ${{ steps.integration_test_count.outcome }}
        run: |
          if ($env:BUILD_OUTCOME -ne 'success' -or $env:TEST_OUTCOME -ne 'success' -or $env:TEST_COUNT_OUTCOME -ne 'success') {
            throw "Campaign crash-boundary validation failure: build=$env:BUILD_OUTCOME, test=$env:TEST_OUTCOME, test_count=$env:TEST_COUNT_OUTCOME."
          }

  integration_remaining:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact workflow head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected workflow head $env:EXPECTED_SHA but checked out $actual."
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Record runner, toolchain, and concurrency facts
        shell: pwsh
        env:
          CI_CONCURRENCY_GROUP: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
          CI_CANCEL_IN_PROGRESS: ${{ github.event_name == 'pull_request' }}
        run: |
          Write-Output "runner.os=$env:RUNNER_OS"
          Write-Output "runner.arch=$env:RUNNER_ARCH"
          Write-Output "runner.image.os=$env:ImageOS"
          Write-Output "runner.image.version=$env:ImageVersion"
          Write-Output "ci.concurrency.group=$env:CI_CONCURRENCY_GROUP"
          Write-Output "ci.concurrency.cancel-in-progress=$env:CI_CANCEL_IN_PROGRESS"
          dotnet --info
          dotnet msbuild -version
      - name: Restore
        run: dotnet restore ContractScribe.slnx
      - name: Build
        id: build
        run: dotnet build ContractScribe.slnx --configuration Release --no-restore
      - name: Remaining integration partition
        id: integration_tests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: >-
          dotnet test tests/ContractScribe.IntegrationTests/ContractScribe.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName!=ContractScribe.Roslyn.IntegrationTests.CampaignCliProcessTests.EveryFrozenBoundary_IsAcknowledgedTerminatedAndReinvokedAgainstTheSameCheckpoint"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=integration-remaining-${{ runner.os }}"
          --results-directory TestResults/ci/integration-remaining
      - name: Require discovered remaining integration tests
        id: integration_test_count
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path TestResults/ci/integration-remaining -Filter *.trx -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            throw "The remaining-integration command produced no TRX file."
          }
          [xml] $trx = Get-Content -Raw -LiteralPath $files[0].FullName
          $total = [int] $trx.TestRun.ResultSummary.Counters.total
          if ($total -le 0) {
            throw "The remaining-integration filter discovered zero tests."
          }
          Write-Output "integration.remaining.tests.total=$total"
      - name: Upload remaining-integration TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-remaining-trx-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: TestResults/ci/integration-remaining/*.trx
          if-no-files-found: error
      - name: Aggregate remaining-integration outcomes
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.integration_tests.outcome }}
          TEST_COUNT_OUTCOME: ${{ steps.integration_test_count.outcome }}
        run: |
          if ($env:BUILD_OUTCOME -ne 'success' -or $env:TEST_OUTCOME -ne 'success' -or $env:TEST_COUNT_OUTCOME -ne 'success') {
            throw "Remaining-integration validation failure: build=$env:BUILD_OUTCOME, test=$env:TEST_OUTCOME, test_count=$env:TEST_COUNT_OUTCOME."
          }

  integration_unfiltered_evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.include_unfiltered_evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Assert exact workflow head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected workflow head $env:EXPECTED_SHA but checked out $actual."
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Record runner, toolchain, and concurrency facts
        shell: pwsh
        env:
          CI_CONCURRENCY_GROUP: ${{ format('{0}-{1}', github.workflow, github.run_id) }}
          CI_CANCEL_IN_PROGRESS: 'false'
        run: |
          Write-Output "runner.os=$env:RUNNER_OS"
          Write-Output "runner.arch=$env:RUNNER_ARCH"
          Write-Output "runner.image.os=$env:ImageOS"
          Write-Output "runner.image.version=$env:ImageVersion"
          Write-Output "ci.concurrency.group=$env:CI_CONCURRENCY_GROUP"
          Write-Output "ci.concurrency.cancel-in-progress=$env:CI_CANCEL_IN_PROGRESS"
          dotnet --info
          dotnet msbuild -version
      - name: Restore
        run: dotnet restore ContractScribe.slnx
      - name: Build
        id: build
        run: dotnet build ContractScribe.slnx --configuration Release --no-restore
      - name: Unfiltered integration evidence
        id: integration_tests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 55
        run: >-
          dotnet test tests/ContractScribe.IntegrationTests/ContractScribe.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=integration-unfiltered-${{ runner.os }}"
          --results-directory TestResults/ci/integration-unfiltered
      - name: Require discovered unfiltered integration tests
        id: integration_test_count
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path TestResults/ci/integration-unfiltered -Filter *.trx -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            throw "The unfiltered integration command produced no TRX file."
          }
          [xml] $trx = Get-Content -Raw -LiteralPath $files[0].FullName
          $total = [int] $trx.TestRun.ResultSummary.Counters.total
          if ($total -le 0) {
            throw "The unfiltered integration command discovered zero tests."
          }
          Write-Output "integration.unfiltered.tests.total=$total"
      - name: Upload unfiltered-integration TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-unfiltered-trx-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: TestResults/ci/integration-unfiltered/*.trx
          if-no-files-found: error
      - name: Aggregate unfiltered-integration outcomes
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.integration_tests.outcome }}
          TEST_COUNT_OUTCOME: ${{ steps.integration_test_count.outcome }}
        run: |
          if ($env:BUILD_OUTCOME -ne 'success' -or $env:TEST_OUTCOME -ne 'success' -or $env:TEST_COUNT_OUTCOME -ne 'success') {
            throw "Unfiltered-integration evidence failure: build=$env:BUILD_OUTCOME, test=$env:TEST_OUTCOME, test_count=$env:TEST_COUNT_OUTCOME."
          }

  payload_producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact workflow head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected workflow head $env:EXPECTED_SHA but checked out $actual."
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Record runner, toolchain, and concurrency facts
        shell: pwsh
        env:
          CI_CONCURRENCY_GROUP: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
          CI_CANCEL_IN_PROGRESS: ${{ github.event_name == 'pull_request' }}
        run: |
          Write-Output "runner.os=$env:RUNNER_OS"
          Write-Output "runner.arch=$env:RUNNER_ARCH"
          Write-Output "runner.image.os=$env:ImageOS"
          Write-Output "runner.image.version=$env:ImageVersion"
          Write-Output "ci.concurrency.group=$env:CI_CONCURRENCY_GROUP"
          Write-Output "ci.concurrency.cancel-in-progress=$env:CI_CANCEL_IN_PROGRESS"
          dotnet --info
          dotnet msbuild -version
      - name: Restore
        run: dotnet restore ContractScribe.slnx
      - name: Build
        id: build
        run: dotnet build ContractScribe.slnx --configuration Release --no-restore
      - name: Build D2 payload archive
        id: payload_build
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: bash scripts/release/build-payload.sh --output artifacts/payload
      - name: Record source-oracle expected outputs
        id: source_oracle
        if: always() && steps.payload_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SRC="src/ContractScribe.Cli/bin/Release/net10.0/ContractScribe.Cli.dll"
          EXP="kit/expected"
          mkdir -p "$EXP"
          dotnet "$SRC" --version > "$EXP/version.txt"
          dotnet "$SRC" --help > "$EXP/help-top.txt"
          dotnet "$SRC" audit --help > "$EXP/help-audit.txt"
          dotnet "$SRC" campaign --help > "$EXP/help-campaign.txt"
          dotnet "$SRC" github-proposal --help > "$EXP/help-github-proposal.txt"
          cp config/defaults.json "$EXP/config-defaults.json"
          cp global.json kit/global.json
          FX="$(mktemp -d)/fx"
          cp -r tests/packaging/fixture/. "$FX/"
          dotnet restore "$FX/Fixture.slnx" --nologo
          dotnet build "$FX/Fixture.slnx" --no-restore --nologo
          rc=0
          dotnet "$SRC" audit --repository-root "$FX" --input Fixture.slnx \
            --policy policy.json --output "$EXP/audit-result.json" \
            > "$EXP/audit-stdout.json" 2> "$EXP/audit-stderr.txt" || rc=$?
          echo "$rc" > "$EXP/audit-exit.txt"
      - name: Record packed-test expected projections
        id: record_mode
        if: always() && steps.source_oracle.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CONTRACTSCRIBE_PACKAGED_MODE: record
          CONTRACTSCRIBE_PACKAGED_CLI: ${{ github.workspace }}/src/ContractScribe.Cli/bin/Release/net10.0/ContractScribe.Cli.dll
          CONTRACTSCRIBE_PACKAGING_EXPECTED: ${{ github.workspace }}/kit/expected
          CONTRACTSCRIBE_PACKAGING_FIXTURE: ${{ github.workspace }}/tests/packaging/fixture
          CONTRACTSCRIBE_STARTUP_HOOK_PATH: ${{ github.workspace }}/tests/ContractScribe.CampaignStartupHook/bin/Release/net10.0/ContractScribe.CampaignStartupHook.dll
        run: >-
          dotnet test tests/ContractScribe.IntegrationTests/ContractScribe.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~PackagedCli"
          --logger "trx;LogFilePrefix=packaged-record-${{ runner.os }}"
          --results-directory TestResults/ci/packaged-record
      - name: Assemble packaging test kit
        id: assemble_kit
        if: always() && steps.record_mode.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit/tests kit/testbin kit/hook
          cp -r tests/packaging kit/tests/packaging
          mv kit/tests/packaging/fixture kit/fixture
          cp -r tests/ContractScribe.IntegrationTests/bin/Release/net10.0/. kit/testbin/
          cp tests/ContractScribe.CampaignStartupHook/bin/Release/net10.0/ContractScribe.CampaignStartupHook.dll kit/hook/
          test -f kit/expected/audit-result.json
          for f in campaign-lifecycle campaign-nowork layered identity github-publish-replay github-missing-token; do
            test -f "kit/expected/$f.expected.json" || { echo "missing expected projection: $f"; exit 1; }
          done
      - name: Upload D2 payload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-payload-attempt-${{ github.run_attempt }}
          path: artifacts/payload/
          if-no-files-found: error
      - name: Upload packaging test kit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaging-test-kit-attempt-${{ github.run_attempt }}
          path: kit/
          if-no-files-found: error
      - name: Upload packaged-record TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaged-record-trx-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: TestResults/ci/packaged-record/*.trx
          if-no-files-found: error
      - name: Aggregate payload producer outcomes
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PAYLOAD_BUILD_OUTCOME: ${{ steps.payload_build.outcome }}
          SOURCE_ORACLE_OUTCOME: ${{ steps.source_oracle.outcome }}
          RECORD_OUTCOME: ${{ steps.record_mode.outcome }}
          KIT_OUTCOME: ${{ steps.assemble_kit.outcome }}
        run: |
          $outcomes = @{
            build = $env:BUILD_OUTCOME
            payload_build = $env:PAYLOAD_BUILD_OUTCOME
            source_oracle = $env:SOURCE_ORACLE_OUTCOME
            record = $env:RECORD_OUTCOME
            kit = $env:KIT_OUTCOME
          }
          $failures = @($outcomes.GetEnumerator() | Where-Object Value -ne 'success' | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($failures.Count -gt 0) {
            throw "Payload producer failure: $($failures -join ', ')."
          }

  packed_payload:
    needs: payload_producer
    runs-on: ubuntu-latest
    steps:
      # Deliberately no actions/checkout: the packed payload must install and
      # execute without the ContractScribe source tree.
      - name: Download D2 payload artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: d2-payload-attempt-${{ github.run_attempt }}
          path: payload
      - name: Download packaging test kit
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: packaging-test-kit-attempt-${{ github.run_attempt }}
          path: kit
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: kit/global.json
      - name: Verify packed payload
        id: packed_verify
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$PWD/payload" -name 'contract-scribe-*-linux-x64.tar.gz' | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "expected exactly one payload archive, found ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          sha_file="${archive%.tar.gz}.sha256"
          test -f "$sha_file"
          bash kit/tests/packaging/verify-payload.sh \
            --kit "$PWD/kit" \
            --archive "$archive" \
            --sha256-file "$sha_file" \
            --work "$PWD/verify-work" --keep
      - name: Upload packed verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-verify-logs-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: |
            verify-work/*/logs/
            verify-work/*/TestResults/
          if-no-files-found: error
      - name: Aggregate packed payload outcomes
        if: always()
        shell: pwsh
        env:
          VERIFY_OUTCOME: ${{ steps.packed_verify.outcome }}
        run: |
          if ($env:VERIFY_OUTCOME -ne 'success') {
            throw "Packed payload verification failure: verify=$env:VERIFY_OUTCOME."
          }

  action_packaged:
    # M6-A2: the composite Action end-to-end - acquisition through a strictly
    # gated test map, frozen install semantics, real CLI invocation against
    # loopback fakes. Also proves byte reproducibility of the payload build:
    # the producer artifact must equal an independent clean rebuild of the
    # checked-out revision. While payload-map.json carries payload:null the
    # production acquisition path fails closed; once a pair is recorded this
    # job additionally rebuilds the mapped sourceRevision and requires byte
    # equality with the map.
    needs: payload_producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          path: action-src
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: packaging-test-kit-attempt-${{ github.run_attempt }}
          path: kit
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: d2-payload-attempt-${{ github.run_attempt }}
          path: producer-payload
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: kit/global.json
      - name: Independent clean rebuild of the checked-out revision
        id: payload_build
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet --info | head -20
          bash action-src/scripts/release/build-payload.sh --output payload-build
          find payload-build -name '*.tar.gz' -o -name '*.sha256' -o -name '*.payload.json'
      - name: Assert byte reproducibility and map state
        id: pair_check
        shell: bash
        env:
          MAP: action-src/scripts/action/payload-map.json
        run: |
          set -euo pipefail
          python3 - "$MAP" <<'PYEOF'
          import glob, hashlib, json, sys
          digest = lambda p: hashlib.sha256(open(p, "rb").read()).hexdigest()
          rebuilt = glob.glob("payload-build/**/*.tar.gz", recursive=True)
          produced = glob.glob("producer-payload/**/*.tar.gz", recursive=True)
          assert len(rebuilt) == 1, rebuilt
          assert len(produced) == 1, produced
          archive = rebuilt[0]
          sha = digest(archive)
          # Byte reproducibility: the independent clean rebuild of the
          # checked-out revision must equal the producer artifact exactly.
          # On mismatch, name the differing members so SDK/image drift
          # between the two runners is diagnosable from the log.
          if sha != digest(produced[0]):
              import tarfile
              def members(path):
                  out = {}
                  with tarfile.open(path, "r:gz") as tar:
                      for m in tar:
                          if m.isfile():
                              out[m.name] = (m.size, hashlib.sha256(
                                  tar.extractfile(m).read()).hexdigest())
                  return out
              a, b = members(archive), members(produced[0])
              for name in sorted(set(a) | set(b)):
                  if name not in a:
                      print(f"only in producer: {name} (size {b[name][0]})")
                  elif name not in b:
                      print(f"only in rebuild: {name} (size {a[name][0]})")
                  elif a[name] != b[name]:
                      print(f"differs: {name} "
                            f"(rebuild size {a[name][0]}, "
                            f"producer size {b[name][0]})")
              raise AssertionError(
                  "clean rebuild is not byte-identical to the producer artifact")
          manifest = archive[:-7] + ".payload.json"
          assert open(manifest, "rb").read() == \
              open(produced[0][:-7] + ".payload.json", "rb").read(), \
              "rebuilt .payload.json differs from the producer manifest"
          recorded = open(archive[:-7] + ".sha256").read().split()[0]
          assert recorded == sha, ".sha256 sidecar does not match the archive"
          payload = json.load(open(sys.argv[1]))["payload"]
          if payload is None:
              print("map: no authorized pair (pre-release)")
          else:
              with open("pair-revision.txt", "w") as fh:
                  fh.write(payload["sourceRevision"])
              with open("pair-expected.json", "w") as fh:
                  json.dump(payload, fh)
          with open("pair-archive-path.txt", "w") as fh:
              fh.write(archive)
          PYEOF
          if [ -f pair-revision.txt ]; then
            SRC="$(cat pair-revision.txt)"
            mkdir pair-src
            git -C pair-src init -q
            git -C pair-src remote add origin https://github.com/SolusQuest/contract-scribe.git
            git -C pair-src fetch --depth 1 origin "$SRC"
            git -C pair-src checkout -q --detach FETCH_HEAD
            bash pair-src/scripts/release/build-payload.sh --output pair-build
            python3 - <<'PYEOF'
          import glob, hashlib, json
          digest = lambda p: hashlib.sha256(open(p, "rb").read()).hexdigest()
          payload = json.load(open("pair-expected.json"))
          archives = glob.glob("pair-build/**/*.tar.gz", recursive=True)
          assert len(archives) == 1, archives
          manifest = json.load(open(archives[0][:-7] + ".payload.json"))
          computed = digest(archives[0])
          if computed != payload["sha256"]:
              print("mapped pair rebuild mismatch: "
                    f"toolVersion={manifest['toolVersion']} "
                    f"sourceRevision={manifest['sourceRevision']} "
                    f"recorded sha256={payload['sha256']} "
                    f"computed sha256={computed}")
          assert computed == payload["sha256"], \
              "mapped pair rebuild does not equal the recorded sha256"
          assert payload["assetName"] == \
              "contract-scribe-%s-linux-x64.tar.gz" % manifest["toolVersion"]
          assert payload["toolVersion"] == manifest["toolVersion"]
          PYEOF
          fi
      - name: Run the script/test matrix
        id: matrix
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          archive="$(cat pair-archive-path.txt)"
          bash action-src/tests/action/verify-action.sh \
            --kit "$PWD/kit" \
            --archive "$archive" \
            --sha256-file "${archive%.tar.gz}.sha256" \
            --real --work "$PWD/verify-work" --keep
      - name: Start loopback fakes
        id: fakes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fakes
          python3 - "$PWD/fakes" <<'PYEOF'
          import hashlib, json, os, sys
          archive = open("pair-archive-path.txt").read().strip()
          manifest = json.load(open(archive[:-7] + ".payload.json"))
          sha = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          asset = os.path.basename(archive)
          # The gated test map authorizes exactly this rebuilt pair; the
          # committed production map stays payload:null.
          test_map = {"mapVersion": 1, "wrapper": "contract-scribe-action",
              "payload": {"repository": "SolusQuest/contract-scribe",
                  "releaseTag": "payload-" + manifest["toolVersion"],
                  "toolVersion": manifest["toolVersion"],
                  "sourceRevision": manifest["sourceRevision"],
                  "runtimeIdentifier": "linux-x64",
                  "assetName": asset,
                  "sha256": sha,
                  "assets": [asset]}}
          json.dump(test_map, open(sys.argv[1] + "/test-map.json", "w"))
          m = test_map["payload"]
          cfg = {"repository": m["repository"],
                 "expected_token": "contract-scribe-synthetic-acquisition-only",
                 "require_auth": False,
                 "releases": [{"id": 1, "tag": m["releaseTag"], "draft": False,
                     "assets": [{"id": 1, "name": m["assetName"],
                                 "file": archive}]}],
                 "overrides": {}}
          json.dump(cfg, open(sys.argv[1] + "/release-config.json", "w"))
          gh = {"files": {"README.md": "# synthetic\n", "src/App.cs": "class A {}\n"}}
          json.dump(gh, open(sys.argv[1] + "/github-config.json", "w"))
          PYEOF
          touch fakes/release.log fakes/provider.log fakes/hang.log fakes/github.log fakes/github-failures.log
          python3 action-src/tests/action/fake_release_api.py fakes/release-config.json fakes/release-ready.json fakes/release.log &
          python3 action-src/tests/action/fake_provider.py proposal fakes/provider-ready.json fakes/provider.log &
          python3 action-src/tests/action/fake_provider.py hang fakes/hang-ready.json fakes/hang.log &
          for f in release provider hang; do
            for _ in $(seq 100); do [ -f "fakes/$f-ready.json" ] && break; sleep 0.1; done
            [ -f "fakes/$f-ready.json" ]
          done
          {
            echo "api_root=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["api"])' fakes/release-ready.json)"
            echo "provider=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["endpoint"])' fakes/provider-ready.json)"
            echo "hang=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["endpoint"])' fakes/hang-ready.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare target fixture (spaced path)
        id: target
        shell: bash
        env:
          PROVIDER: ${{ steps.fakes.outputs.provider }}
        run: |
          set -euo pipefail
          TGT="$PWD/target repo a2"
          mkdir -p "$TGT"
          cp -r kit/fixture/. "$TGT/"
          cp kit/global.json "$TGT/global.json"
          (cd "$TGT" && dotnet restore Fixture.slnx --nologo >/dev/null              && dotnet build Fixture.slnx --no-restore --nologo >/dev/null)
          # The CLI verifies each governed file's original sha256 against the
          # fake's base tree: seed the remote repo with the real file set.
          python3 - "$TGT" fakes/github-config.json <<'PYEOF'
          import json, os, sys
          root, out = sys.argv[1], sys.argv[2]
          files = {}
          for base, dirs, names in os.walk(root):
              dirs[:] = [d for d in dirs if d not in ("obj", "bin", ".git")]
              for name in names:
                  path = os.path.join(base, name)
                  rel = os.path.relpath(path, root).replace(os.sep, "/")
                  if rel.endswith((".cs", ".csproj")) or rel == "policy.json":
                      files[rel] = open(path, encoding="utf-8").read()
          json.dump({"files": files}, open(out, "w"))
          PYEOF
          python3 action-src/tests/action/fake_github_api.py fakes/github-config.json fakes/github-ready.json fakes/github.log fakes/github-failures.log &
          for _ in $(seq 100); do [ -f fakes/github-ready.json ] && break; sleep 0.1; done
          [ -f fakes/github-ready.json ]
          BASE_OID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["baseOid"])' fakes/github-ready.json)"
          {
            echo "github=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["endpoint"])' fakes/github-ready.json)"
            echo "base_oid=$BASE_OID"
          } >> "$GITHUB_OUTPUT"
          mkdir -p action-inputs checkpoint-state checkpoint-state-2
          chmod 0700 checkpoint-state checkpoint-state-2
          cat > action-inputs/request.json <<EOFX
          {"githubProposalRequestVersion":1,
           "campaignLineage":"campaign.action.e2e","snapshot":"snapshot.action.e2e",
           "state":"$PWD/checkpoint-state/state.bin",
           "github":{"repositoryOwner":"Owner","repositoryName":"repo",
             "targetRef":"refs/heads/main","expectedBaseCommitOid":"$BASE_OID",
             "operationId":"operation.e2e","generationId":"generation.e2e",
             "policy":{"maximumDocumentationBlocks":128,
               "maximumDistinctChangedFiles":128,
               "maximumCumulativePatchBytes":4194304},
             "transition":"initial"}}
          EOFX
          sed 's|checkpoint-state/state.bin|checkpoint-state-2/state.bin|'               action-inputs/request.json > action-inputs/request-2.json
          {
            echo "request-json<<CSREQ"
            cat action-inputs/request.json
            echo "CSREQ"
            echo "request2-json<<CSREQ"
            cat action-inputs/request-2.json
            echo "CSREQ"
          } >> "$GITHUB_OUTPUT"
          cat > action-inputs/layer.json <<EOFX
          {"consumerConfigurationVersion":1,
           "provider":{"endpoint":"$PROVIDER","model":"fixture-model",
             "requestProfile":{"toolChoice":"auto"}},
           "budgets":{"campaign":{"maximumCandidatesPerBlock":30,
             "maximumElapsedMilliseconds":3600000}}}
          EOFX
      - name: "E2E happy path through uses"
        id: e2e_ok
        uses: ./action-src
        env:
          CONTRACTSCRIBE_ACTION_TEST: "1"
          CONTRACTSCRIBE_ACTION_TEST_API_ROOT: ${{ steps.fakes.outputs.api_root }}
          CONTRACTSCRIBE_ACTION_TEST_MAP: ${{ github.workspace }}/fakes/test-map.json
          DOTNET_STARTUP_HOOKS: ${{ github.workspace }}/kit/hook/ContractScribe.CampaignStartupHook.dll
          CONTRACTSCRIBE_TEST_GITHUB_ENDPOINT: ${{ steps.target.outputs.github }}
          CONTRACTSCRIBE_TEST_GITHUB_OBSERVATIONS: ${{ github.workspace }}/e2e-obs.txt
        with:
          operation: github-proposal-start
          repository-root: ${{ github.workspace }}/target repo a2
          input: Fixture.slnx
          policy: policy.json
          request: ${{ steps.target.outputs.request-json }}
          configuration: ${{ github.workspace }}/action-inputs/layer.json
          provider-api-key: contract-scribe-synthetic-provider-only
          github-token: contract-scribe-synthetic-transport-only
          acquisition-token: contract-scribe-synthetic-acquisition-only
      - name: Assert happy-path outputs
        shell: bash
        env:
          OUTCOME: ${{ steps.e2e_ok.outputs.outcome }}
          STATUS: ${{ steps.e2e_ok.outputs.action-status }}
          RESULT: ${{ steps.e2e_ok.outputs.result }}
        run: |
          set -euo pipefail
          [ "$STATUS" = ok ]
          [ "$OUTCOME" = github-proposal.published ]
          python3 -c 'import json,os; e=json.loads(os.environ["RESULT"]); assert e["outcome"]=="github-proposal.published"'
          grep -q "POST /repos/Owner/repo/pulls" fakes/github.log
          test -s e2e-obs.txt && grep -q token-read e2e-obs.txt
      - name: E2E missing token (product failure, exit 4)
        id: e2e_notoken
        continue-on-error: true
        uses: ./action-src
        env:
          CONTRACTSCRIBE_ACTION_TEST: "1"
          CONTRACTSCRIBE_ACTION_TEST_API_ROOT: ${{ steps.fakes.outputs.api_root }}
          CONTRACTSCRIBE_ACTION_TEST_MAP: ${{ github.workspace }}/fakes/test-map.json
          DOTNET_STARTUP_HOOKS: ${{ github.workspace }}/kit/hook/ContractScribe.CampaignStartupHook.dll
          CONTRACTSCRIBE_TEST_GITHUB_ENDPOINT: ${{ steps.target.outputs.github }}
        with:
          operation: github-proposal-start
          repository-root: ${{ github.workspace }}/target repo a2
          input: Fixture.slnx
          policy: policy.json
          request: ${{ steps.target.outputs.request2-json }}
          configuration: ${{ github.workspace }}/action-inputs/layer.json
          provider-api-key: contract-scribe-synthetic-provider-only
          acquisition-token: contract-scribe-synthetic-acquisition-only
      - name: Assert product-failure outputs
        id: e2e_notoken_assert
        shell: bash
        env:
          STEP_RESULT: ${{ steps.e2e_notoken.outcome }}
          OUTCOME: ${{ steps.e2e_notoken.outputs.outcome }}
          EXIT_CODE: ${{ steps.e2e_notoken.outputs.exit-code }}
          STATUS: ${{ steps.e2e_notoken.outputs.action-status }}
        run: |
          set -euo pipefail
          [ "$STEP_RESULT" = failure ]
          [ "$STATUS" = ok ]
          [ "$OUTCOME" = github-proposal.permission ]
          [ "$EXIT_CODE" = 4 ]
      - name: Upload action verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: action-verify-logs-attempt-${{ github.run_attempt }}
          path: |
            verify-work/*/logs/
            fakes/
            e2e-obs.txt
          if-no-files-found: warn
      - name: Aggregate action outcomes
        if: always()
        shell: pwsh
        env:
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
          E2E_OK: ${{ steps.e2e_ok.outcome }}
          E2E_NOTOKEN_ASSERT: ${{ steps.e2e_notoken_assert.outcome }}
          BUILD_OUTCOME: ${{ steps.payload_build.outcome }}
          PAIR_OUTCOME: ${{ steps.pair_check.outcome }}
        run: |
          if ($env:MATRIX_OUTCOME -ne 'success' -or $env:E2E_OK -ne 'success' `
              -or $env:E2E_NOTOKEN_ASSERT -ne 'success' -or $env:BUILD_OUTCOME -ne 'success' `
              -or $env:PAIR_OUTCOME -ne 'success') {
            throw "action_packaged failure: matrix=$env:MATRIX_OUTCOME e2e_ok=$env:E2E_OK e2e_notoken_assert=$env:E2E_NOTOKEN_ASSERT build=$env:BUILD_OUTCOME pair=$env:PAIR_OUTCOME"
          }

  action_examples_producer:
    # M6-A3: producer leg of the caller-owned campaign example — real
    # checkout of a real git fixture, real Action start against the
    # deterministic substitutes, real upload-artifact. The emitted handoff
    # is sealed for synthetic run 501/schedule; the consumer job authenticates
    # it from a fresh runner. Run ids/numbers/attempts/events are synthetic
    # (a single physical CI run cannot be two workflow runs); artifact
    # id/digest and transport are the real native ones.
    needs: action_packaged
    runs-on: ubuntu-latest
    outputs:
      handoff_artifact_id: ${{ steps.handoff_upload.outputs.artifact-id }}
      handoff_artifact_digest: ${{ steps.handoff_upload.outputs.artifact-digest }}
      target_head: ${{ steps.target.outputs.target_head }}
      activation_json: ${{ steps.activation.outputs.activation-json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          path: action-src
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: packaging-test-kit-attempt-${{ github.run_attempt }}
          path: kit
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: d2-payload-attempt-${{ github.run_attempt }}
          path: producer-payload
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: kit/global.json
      - name: Build target fixture as a real git repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TGT="$PWD/target-repo-a3"
          mkdir -p "$TGT"
          cp -r kit/fixture/. "$TGT/"
          cp kit/global.json "$TGT/global.json"
          # Real checkout: HEAD commit is the request's expectedBaseCommitOid
          # AND the fake remote's refs/heads/main. Deterministic
          # author/committer/date makes the sha identical in the consumer job.
          git -C "$TGT" init -q -b main
          git -C "$TGT" config user.email fixture@example.invalid
          git -C "$TGT" config user.name Fixture
          git -C "$TGT" add '*.cs' '*.csproj' '*.slnx' 'policy.json' \
              'global.json' 'NuGet.Config'
          GIT_AUTHOR_DATE='2026-01-01T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-01-01T00:00:00Z' \
              git -C "$TGT" commit -qm 'fixture base'
          TARGET_HEAD="$(git -C "$TGT" rev-parse HEAD)"
          echo "target_head=$TARGET_HEAD" >> "$GITHUB_OUTPUT"
          (cd "$TGT" && dotnet restore Fixture.slnx --nologo >/dev/null \
              && dotnet build Fixture.slnx --no-restore --nologo >/dev/null)
      - name: Start loopback fakes
        id: fakes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fakes
          python3 - fakes <<'PYEOF'
          import glob, hashlib, json, sys
          archive = glob.glob("producer-payload/**/*.tar.gz", recursive=True)[0]
          manifest = json.load(open(archive[:-7] + ".payload.json"))
          sha = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          asset = archive.rsplit("/", 1)[-1]
          test_map = {"mapVersion": 1, "wrapper": "contract-scribe-action",
              "payload": {"repository": "SolusQuest/contract-scribe",
                  "releaseTag": "payload-" + manifest["toolVersion"],
                  "toolVersion": manifest["toolVersion"],
                  "sourceRevision": manifest["sourceRevision"],
                  "runtimeIdentifier": "linux-x64",
                  "assetName": asset,
                  "sha256": sha,
                  "assets": [asset]}}
          json.dump(test_map, open(sys.argv[1] + "/test-map.json", "w"))
          m = test_map["payload"]
          cfg = {"repository": m["repository"],
                 "expected_token": "contract-scribe-synthetic-acquisition-only",
                 "require_auth": False,
                 "releases": [{"id": 1, "tag": m["releaseTag"], "draft": False,
                     "assets": [{"id": 1, "name": m["assetName"],
                                 "file": archive}]}],
                 "overrides": {}}
          json.dump(cfg, open(sys.argv[1] + "/release-config.json", "w"))
          gh = {"repository": "Owner/repo",
                "seed_repo": "target-repo-a3",
                "state_file": "fakes/github-state.json"}
          json.dump(gh, open(sys.argv[1] + "/github-config.json", "w"))
          # Producer-side synthetic Actions metadata: this run is the
          # workflow_dispatch start at run_number 500, attempt 1.
          actions = {
            "repository": {"id": 7001, "full_name": "Owner/repo",
                           "default_branch": "main"},
            "expected_token": "contract-scribe-synthetic-actions-read",
            "runs": {"91001": {
                "id": 91001, "run_number": 500, "run_attempt": 1,
                "event": "workflow_dispatch", "status": "in_progress",
                "conclusion": None, "head_branch": "main",
                "head_sha": "b" * 40, "workflow_id": 55,
                "path": ".github/workflows/contract-scribe-campaign.yml",
                "repository": {"id": 7001, "full_name": "Owner/repo"},
                "head_repository": {"id": 7001}}},
            "artifacts": {}, "run_artifacts": {}}
          json.dump(actions, open(sys.argv[1] + "/actions-config.json", "w"))
          PYEOF
          touch fakes/release.log fakes/provider.log fakes/github.log \
              fakes/github-failures.log fakes/actions.log
          python3 action-src/tests/action/fake_release_api.py \
