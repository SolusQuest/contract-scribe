name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref != 'refs/heads/codex/issue-42-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact workflow head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected workflow head $env:EXPECTED_SHA but checked out $actual."
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ContractScribe.slnx
      - name: Build
        id: build
        run: dotnet build ContractScribe.slnx --configuration Release --no-restore
      - name: Fast suite
        id: fast_tests
        continue-on-error: true
        run: >-
          dotnet test tests/ContractScribe.Tests/ContractScribe.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFilePrefix=fast-${{ runner.os }}"
          --results-directory TestResults/ci/fast
      - name: Integration suite
        id: integration_tests
        continue-on-error: true
        timeout-minutes: 25
        run: >-
          dotnet test tests/ContractScribe.IntegrationTests/ContractScribe.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFilePrefix=integration-${{ runner.os }}"
          --results-directory TestResults/ci/integration
      - name: Verify formatting
        run: dotnet format ContractScribe.slnx --verify-no-changes --no-restore
      - name: CLI help smoke
        run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- --help
      - name: CLI version smoke
        run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- --version
      - name: CLI doctor smoke
        run: dotnet run --project src/ContractScribe.Cli/ContractScribe.Cli.csproj --configuration Release --no-build -- doctor
      - name: Upload fast-suite TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-trx-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: TestResults/ci/fast/*.trx
          if-no-files-found: error
      - name: Upload integration-suite TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-trx-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: TestResults/ci/integration/*.trx
          if-no-files-found: error
      - name: Aggregate suite outcomes
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          FAST_OUTCOME: ${{ steps.fast_tests.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration_tests.outcome }}
        run: |
          if ($env:BUILD_OUTCOME -ne 'success') {
            throw "Build did not succeed; suite aggregation cannot pass."
          }
          $failures = @()
          if ($env:FAST_OUTCOME -ne 'success') {
            $failures += "fast=$env:FAST_OUTCOME"
          }
          if ($env:INTEGRATION_OUTCOME -ne 'success') {
            $failures += "integration=$env:INTEGRATION_OUTCOME"
          }
          if ($failures.Count -gt 0) {
            throw "Test suite failure: $($failures -join ', ')."
          }

  m1-independent-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/issue-42-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    env:
      CONTRACT_SCRIBE_REVISION: ee62d37d245f385b56e31d75a4323f3859880818
      CONTRACT_SCRIBE_MAIN_CI_RUN: "31568102633"
      TARGET_REVISION: 1a54c7c75ef51e7a3d3d01435c6c76c40b336b3d
      TARGET_INPUT: runtime/src/AgenticPrReview.Runtime/AgenticPrReview.Runtime.csproj
      DOTNET_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-noble
      DOTNET_INSTALL_REVISION: 03c981b3ae8261cb0a48b07ac884ce0031af384c
      REQUIRED_SDK_VERSION: 10.0.109
    steps:
      - name: Acquire exact public revisions without credentials
        shell: bash
        run: |
          set -euo pipefail

          root="$RUNNER_TEMP/m1-smoke"
          clean_home="$root/clean-home"
          tool_source="$root/contract-scribe-source"
          tool_work="$root/contract-scribe-work"
          target_source="$root/target-source"
          target_work="$root/target-work"
          run_dir="$root/run"
          tool_nuget_dir="$root/tool-nuget"
          target_nuget_dir="$root/target-nuget"
          tool_home="$root/tool-home"
          target_home="$root/target-home"
          audit_home="$root/audit-home"
          validator_home="$root/validator-home"
          installer_home="$root/installer-home"
          installer_assets="$root/installer-assets"
          exact_dotnet_dir="$root/exact-dotnet"

          mkdir -p \
            "$clean_home" \
            "$run_dir" \
            "$tool_nuget_dir" \
            "$target_nuget_dir" \
            "$tool_home" \
            "$target_home" \
            "$audit_home" \
            "$validator_home" \
            "$installer_home" \
            "$installer_assets" \
            "$exact_dotnet_dir"

          clean_git() {
            env -i \
              PATH="$PATH" \
              HOME="$clean_home" \
              LANG=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 \
              git -c credential.helper= "$@"
          }

          clean_git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/SolusQuest/contract-scribe.git "$tool_source"
          clean_git -C "$tool_source" fetch --quiet --depth=1 origin "$CONTRACT_SCRIBE_REVISION"
          clean_git -C "$tool_source" checkout --quiet --detach "$CONTRACT_SCRIBE_REVISION"

          clean_git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/SolusQuest/agentic-pr-review.git "$target_source"
          clean_git -C "$target_source" fetch --quiet --depth=1 origin "$TARGET_REVISION"
          clean_git -C "$target_source" checkout --quiet --detach "$TARGET_REVISION"

          test "$(git -C "$tool_source" rev-parse HEAD)" = "$CONTRACT_SCRIBE_REVISION"
          test "$(git -C "$target_source" rev-parse HEAD)" = "$TARGET_REVISION"

          if git -C "$tool_source" config --local --get-regexp 'credential|extraheader'; then
            echo "::error::ContractScribe checkout retained a credential configuration."
            exit 1
          fi
          if git -C "$target_source" config --local --get-regexp 'credential|extraheader'; then
            echo "::error::Target checkout retained a credential configuration."
            exit 1
          fi

          mkdir -p "$tool_work" "$target_work"
          cp -a "$tool_source/." "$tool_work/"
          cp -a "$target_source/." "$target_work/"

          cat > "$target_work/.contract-scribe-m1-smoke-policy.json" <<'JSON'
          {
            "schemaVersion": 1,
            "targetProfile": "profile.external-api",
            "defaultDecision": "optional",
            "rules": [
              {
                "id": "m1-smoke-public-api-required",
                "priority": 0,
                "decision": "required"
              }
            ]
          }
          JSON

          expected_status='?? .contract-scribe-m1-smoke-policy.json'
          actual_status="$(git -C "$target_work" status --short --untracked-files=all)"
          test "$actual_status" = "$expected_status"

          (
            cd "$target_work"
            git ls-files -z -- '*.cs' '*.csproj' '*.sln' '*.slnx' '*.props' '*.targets' global.json \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$run_dir/protected-before.sha256"
          test "$(wc -l < "$run_dir/protected-before.sha256")" -gt 0

          {
            echo "SMOKE_ROOT=$root"
            echo "TOOL_WORK=$tool_work"
            echo "TARGET_WORK=$target_work"
            echo "RUN_DIR=$run_dir"
            echo "TOOL_NUGET_DIR=$tool_nuget_dir"
            echo "TARGET_NUGET_DIR=$target_nuget_dir"
            echo "TOOL_HOME=$tool_home"
            echo "TARGET_HOME=$target_home"
            echo "AUDIT_HOME=$audit_home"
            echo "VALIDATOR_HOME=$validator_home"
            echo "INSTALLER_HOME=$installer_home"
            echo "INSTALLER_ASSETS=$installer_assets"
            echo "EXACT_DOTNET_DIR=$exact_dotnet_dir"
          } >> "$GITHUB_ENV"

      - name: Resolve the isolated base image and exact SDK
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet "$DOTNET_IMAGE"
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$DOTNET_IMAGE")"
          case "$image_digest" in
            *@sha256:*) ;;
            *)
              echo "::error::The SDK image did not resolve to a repository digest."
              exit 1
              ;;
          esac
          echo "DOTNET_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          echo "RESOLVED_DOTNET_IMAGE=$image_digest" >> "$GITHUB_ENV"

          installer_url="https://raw.githubusercontent.com/dotnet/install-scripts/$DOTNET_INSTALL_REVISION/src/dotnet-install.sh"
          env -i \
            PATH="$PATH" \
            HOME="$SMOKE_ROOT/clean-home" \
              LANG=C.UTF-8 \
              curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              "$installer_url" \
              --output "$INSTALLER_ASSETS/dotnet-install.sh"
          installer_digest="$(sha256sum "$INSTALLER_ASSETS/dotnet-install.sh" | cut -d' ' -f1)"
          echo "DOTNET_INSTALL_SCRIPT_DIGEST=$installer_digest" >> "$GITHUB_ENV"

          if ! docker run \
            --rm \
            --init \
            --user "$(id -u):$(id -g)" \
            --env HOME=/installer-home \
            --mount "type=bind,source=$INSTALLER_ASSETS,target=/install,readonly" \
            --mount "type=bind,source=$EXACT_DOTNET_DIR,target=/exact-dotnet" \
            --mount "type=bind,source=$INSTALLER_HOME,target=/installer-home" \
            "$image_digest" \
            bash /install/dotnet-install.sh \
              --version "$REQUIRED_SDK_VERSION" \
              --install-dir /exact-dotnet \
              --no-path \
              > "$RUN_DIR/sdk-install.log" \
              2>&1; then
            echo "::error::The credential-free exact SDK installation failed."
            exit 1
          fi

          installed_version="$(docker run \
            --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --env DOTNET_ROOT=/exact-dotnet \
            --env PATH=/exact-dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --mount "type=bind,source=$EXACT_DOTNET_DIR,target=/exact-dotnet,readonly" \
            "$image_digest" \
            dotnet --version)"
          test "$installed_version" = "$REQUIRED_SDK_VERSION"

      - name: Prepare ContractScribe and target prerequisites in a credential-free container
        shell: bash
        run: |
          set -euo pipefail

          tool_container=(
            --rm
            --init
            --user "$(id -u):$(id -g)"
            --workdir /tool
            --env HOME=/tool-home
            --env DOTNET_CLI_HOME=/tool-home
            --env DOTNET_ROOT=/exact-dotnet
            --env PATH=/exact-dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1
            --env DOTNET_NOLOGO=1
            --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
            --env DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1
            --env MSBUILDDISABLENODEREUSE=1
            --env NUGET_PACKAGES=/tool-nuget
            --mount "type=bind,source=$TOOL_WORK,target=/tool"
            --mount "type=bind,source=$TOOL_NUGET_DIR,target=/tool-nuget"
            --mount "type=bind,source=$TOOL_HOME,target=/tool-home"
            --mount "type=bind,source=$EXACT_DOTNET_DIR,target=/exact-dotnet,readonly"
          )

          target_container=(
            --rm
            --init
            --user "$(id -u):$(id -g)"
            --workdir /target
            --env HOME=/target-home
            --env DOTNET_CLI_HOME=/target-home
            --env DOTNET_ROOT=/exact-dotnet
            --env PATH=/exact-dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1
            --env DOTNET_NOLOGO=1
            --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
            --env DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1
            --env MSBUILDDISABLENODEREUSE=1
            --env NUGET_PACKAGES=/target-nuget
            --mount "type=bind,source=$TARGET_WORK,target=/target"
            --mount "type=bind,source=$TARGET_NUGET_DIR,target=/target-nuget"
            --mount "type=bind,source=$TARGET_HOME,target=/target-home"
            --mount "type=bind,source=$EXACT_DOTNET_DIR,target=/exact-dotnet,readonly"
          )

          run_quiet() {
            local label="$1"
            local log="$2"
            shift 2
            set +e
            "$@" > "$log" 2>&1
            local status=$?
            set -e
            if test "$status" -ne 0; then
              echo "::error::$label failed with exit $status; raw preparation output remains unpublished."
              exit "$status"
            fi
          }

          run_quiet \
            contract-scribe-restore \
            "$RUN_DIR/contract-scribe-restore.log" \
            docker run "${tool_container[@]}" "$RESOLVED_DOTNET_IMAGE" \
              dotnet restore ContractScribe.slnx --verbosity quiet
          run_quiet \
            contract-scribe-build \
            "$RUN_DIR/contract-scribe-build.log" \
            docker run "${tool_container[@]}" "$RESOLVED_DOTNET_IMAGE" \
              dotnet build ContractScribe.slnx --configuration Release --no-restore --verbosity quiet

          run_quiet \
            target-restore \
            "$RUN_DIR/target-restore.log" \
            docker run "${target_container[@]}" "$RESOLVED_DOTNET_IMAGE" \
              dotnet restore "$TARGET_INPUT" --verbosity quiet
          run_quiet \
            target-build \
            "$RUN_DIR/target-build.log" \
            docker run "${target_container[@]}" "$RESOLVED_DOTNET_IMAGE" \
              dotnet build "$TARGET_INPUT" --configuration Release --no-restore --verbosity quiet

          docker run "${target_container[@]}" "$RESOLVED_DOTNET_IMAGE" \
            dotnet --version > "$RUN_DIR/sdk-version.txt"

          expected_status='?? .contract-scribe-m1-smoke-policy.json'
          actual_status="$(git -C "$TARGET_WORK" status --short --untracked-files=all)"
          test "$actual_status" = "$expected_status"

          (
            cd "$TARGET_WORK"
            git ls-files -z -- '*.cs' '*.csproj' '*.sln' '*.slnx' '*.props' '*.targets' global.json \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$RUN_DIR/protected-pre-audit.sha256"
          cmp "$RUN_DIR/protected-before.sha256" "$RUN_DIR/protected-pre-audit.sha256"

          prep_output_count="$({
            find "$TARGET_WORK" -type f -path '*/bin/*' -print
            find "$TARGET_WORK" -type f -path '*/obj/*' -print
          } | sort -u | wc -l)"
          echo "PREP_OUTPUT_COUNT=$prep_output_count" >> "$GITHUB_ENV"

      - name: Run the read-only audit without network or credentials
        shell: bash
        run: |
          set -euo pipefail

          audit_container=(
            --rm
            --init
            --network none
            --user "$(id -u):$(id -g)"
            --workdir /target
            --env HOME=/audit-home
            --env DOTNET_CLI_HOME=/audit-home
            --env DOTNET_ROOT=/exact-dotnet
            --env PATH=/exact-dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1
            --env DOTNET_NOLOGO=1
            --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
            --env DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1
            --env MSBUILDDISABLENODEREUSE=1
            --env NUGET_PACKAGES=/target-nuget
            --mount "type=bind,source=$TOOL_WORK,target=/tool,readonly"
            --mount "type=bind,source=$TARGET_WORK,target=/target"
            --mount "type=bind,source=$RUN_DIR,target=/run"
            --mount "type=bind,source=$TARGET_NUGET_DIR,target=/target-nuget,readonly"
            --mount "type=bind,source=$AUDIT_HOME,target=/audit-home"
            --mount "type=bind,source=$EXACT_DOTNET_DIR,target=/exact-dotnet,readonly"
          )

          set +e
          docker run "${audit_container[@]}" "$RESOLVED_DOTNET_IMAGE" \
            dotnet /tool/src/ContractScribe.Cli/bin/Release/net10.0/ContractScribe.Cli.dll \
              audit \
              --repository-root /target \
              --input "$TARGET_INPUT" \
              --policy .contract-scribe-m1-smoke-policy.json \
              --output /run/audit-result.json \
              > "$RUN_DIR/envelope.json" \
              2> "$RUN_DIR/diagnostics.txt"
          audit_exit=$?
          set -e

          echo "AUDIT_EXIT_CODE=$audit_exit" >> "$GITHUB_ENV"
          if test "$audit_exit" -ne 0 && test "$audit_exit" -ne 1; then
            diagnostic_codes="$(sed -n 's/:.*//p' "$RUN_DIR/diagnostics.txt" | sort -u | paste -sd, -)"
            echo "::error::The controlled audit returned exit $audit_exit; diagnostic codes: ${diagnostic_codes:-none}."
            exit 1
          fi

      - name: Validate canonical result, counts, and protected inputs
        shell: bash
        run: |
          set -euo pipefail

          expected_status='?? .contract-scribe-m1-smoke-policy.json'
          actual_status="$(git -C "$TARGET_WORK" status --short --untracked-files=all)"
          test "$actual_status" = "$expected_status"

          (
            cd "$TARGET_WORK"
            git ls-files -z -- '*.cs' '*.csproj' '*.sln' '*.slnx' '*.props' '*.targets' global.json \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$RUN_DIR/protected-after.sha256"
          cmp "$RUN_DIR/protected-pre-audit.sha256" "$RUN_DIR/protected-after.sha256"

          post_output_count="$({
            find "$TARGET_WORK" -type f -path '*/bin/*' -print
            find "$TARGET_WORK" -type f -path '*/obj/*' -print
          } | sort -u | wc -l)"
          echo "POST_OUTPUT_COUNT=$post_output_count" >> "$GITHUB_ENV"
          export POST_OUTPUT_COUNT="$post_output_count"

          {
            printf '{"logicalInputs":['
            cat "$RUN_DIR/audit-result.json"
            printf ','
            cat "$RUN_DIR/audit-result.json"
            printf ']}'
          } > "$RUN_DIR/replay.json"

          validator_container=(
            --rm
            --init
            --network none
            --user "$(id -u):$(id -g)"
            --workdir /tool
            --env HOME=/validator-home
            --env DOTNET_CLI_HOME=/validator-home
            --env DOTNET_ROOT=/exact-dotnet
            --env PATH=/exact-dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1
            --env DOTNET_NOLOGO=1
            --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
            --env NUGET_PACKAGES=/tool-nuget
            --mount "type=bind,source=$TOOL_WORK,target=/tool,readonly"
            --mount "type=bind,source=$RUN_DIR,target=/run"
            --mount "type=bind,source=$TOOL_NUGET_DIR,target=/tool-nuget,readonly"
            --mount "type=bind,source=$VALIDATOR_HOME,target=/validator-home"
            --mount "type=bind,source=$EXACT_DOTNET_DIR,target=/exact-dotnet,readonly"
          )

          canonical_digest="$(docker run "${validator_container[@]}" "$RESOLVED_DOTNET_IMAGE" \
            dotnet /tool/tests/ContractScribe.ContractBaselineProbe/bin/Release/net10.0/ContractScribe.ContractBaselineProbe.dll \
              /run/replay.json)"
          actual_digest="$(sha256sum "$RUN_DIR/audit-result.json" | cut -d' ' -f1)"
          test "$canonical_digest" = "$actual_digest"

          export CANONICAL_DIGEST="$canonical_digest"
          export ACTUAL_DIGEST="$actual_digest"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const runDir = process.env.RUN_DIR;
          const envelope = JSON.parse(fs.readFileSync(path.join(runDir, 'envelope.json'), 'utf8'));
          const result = JSON.parse(fs.readFileSync(path.join(runDir, 'audit-result.json'), 'utf8'));
          const outcomes = {
            'audit.outcome.compliant': 'compliant',
            'audit.outcome.violation': 'violation',
            'audit.outcome.skipped': 'skipped',
          };
          const counts = { compliant: 0, violation: 0, skipped: 0 };
          for (const row of result.results) {
            const key = outcomes[row.auditOutcome];
            if (!key) throw new Error(`Unexpected audit outcome: ${row.auditOutcome}`);
            counts[key] += 1;
          }
          const total = counts.compliant + counts.violation + counts.skipped;
          if (total !== result.results.length) throw new Error('Outcome counts do not reconcile.');
          if (total === 0 || counts.compliant + counts.violation === 0) {
            throw new Error('The target produced no audit judgments.');
          }
          if (envelope.terminalLayer !== 'audit' || envelope.terminalState !== 'committed') {
            throw new Error('The CLI did not commit an audit terminal.');
          }
          if (envelope.sourceRevision !== process.env.CONTRACT_SCRIBE_REVISION) {
            throw new Error('The CLI source revision does not match the fixed ContractScribe revision.');
          }
          for (const key of Object.keys(counts)) {
            if (envelope.counts[key] !== counts[key]) {
              throw new Error(`Envelope count mismatch for ${key}.`);
            }
          }
          if (envelope.resultDigest !== process.env.ACTUAL_DIGEST) {
            throw new Error('Envelope digest does not match the committed canonical bytes.');
          }
          if (process.env.CANONICAL_DIGEST !== process.env.ACTUAL_DIGEST) {
            throw new Error('Independent canonicalization digest mismatch.');
          }
          const auditExit = Number(process.env.AUDIT_EXIT_CODE);
          if (auditExit === 0 && counts.violation !== 0) {
            throw new Error('Exit 0 is inconsistent with violation results.');
          }
          if (auditExit === 1 && counts.violation === 0) {
            throw new Error('Exit 1 is inconsistent with a zero-violation result.');
          }
          const summary = {
            outcome: 'successful-committed-audit',
            contractScribeRevision: process.env.CONTRACT_SCRIBE_REVISION,
            contractScribeMainCiRun: process.env.CONTRACT_SCRIBE_MAIN_CI_RUN,
            targetRevision: process.env.TARGET_REVISION,
            targetInput: process.env.TARGET_INPUT,
            sdkVersion: fs.readFileSync(path.join(runDir, 'sdk-version.txt'), 'utf8').trim(),
            dotnetInstallRevision: process.env.DOTNET_INSTALL_REVISION,
            dotnetInstallScriptDigest: process.env.DOTNET_INSTALL_SCRIPT_DIGEST,
            toolchain: envelope.toolchain,
            auditExit,
            disposition: envelope.disposition,
            counts: { ...counts, total },
            resultDigest: process.env.ACTUAL_DIGEST,
            protectedSourceProjectSet: 'unchanged',
            prerequisiteOutputCount: Number(process.env.PREP_OUTPUT_COUNT),
            postAuditOutputCount: Number(process.env.POST_OUTPUT_COUNT),
            networkDuringAudit: 'disabled-by-container',
            credentialExposureToTarget: 'none',
          };
          fs.writeFileSync(path.join(runDir, 'bounded-summary.json'), JSON.stringify(summary));
          NODE

      - name: Publish bounded smoke summary
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_LABEL="${{ runner.os }}-${{ runner.arch }}"
          export RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const summary = JSON.parse(fs.readFileSync(path.join(process.env.RUN_DIR, 'bounded-summary.json'), 'utf8'));
          const lines = [
            '# M1 independent read-only smoke',
            '',
            `- Outcome: ${summary.outcome}`,
            `- ContractScribe revision: \`${summary.contractScribeRevision}\``,
            `- Ordinary main CI run: ${summary.contractScribeMainCiRun}`,
