# Copy alongside .github/contract-scribe/caller.py and select a reviewed Action ref.
# Set CONTRACTSCRIBE_CAMPAIGN_LINEAGE and CONTRACTSCRIBE_CAMPAIGN repository variables.
# The campaign JSON is the stable githubCampaignVersion/campaignLineage/github
# configuration. Every trigger passes identical inputs; CLI chooses lifecycle.
# Provider/acquisition secrets are passed only to the Action; publication uses
# this job's github.token. Optional schedule is best-effort, with no timing guarantee.
name: ContractScribe campaign

on:
  workflow_dispatch: {}
  # Optional: uncomment to enable best-effort native scheduling.
  # schedule:
  #   - cron: '*/30 * * * *'
  # External callers may use GitHub's workflow_dispatch API with the same inputs.

permissions: {}

concurrency:
  group: contract-scribe-${{ vars.CONTRACTSCRIBE_CAMPAIGN_LINEAGE || 'unconfigured' }}
  cancel-in-progress: false

env:
  CS_HELPER: ${{ github.workspace }}/.github/contract-scribe/caller.py
  CS_CAMPAIGN_LINEAGE: ${{ vars.CONTRACTSCRIBE_CAMPAIGN_LINEAGE }}
  # The checked-out target revision, input surface, policy file and optional
  # consumer configuration layer are ordinary file edits for the caller.
  # CS_CONFIGURATION may stay empty to use the payload defaults; to supply a
  # layer, copy examples/github-actions/campaign-layer.example.json to a path
  # of your choice and point this variable at it:
  CS_INPUT: Fixture.slnx
  CS_POLICY: policy.json
  CS_CONFIGURATION: ""
  CS_RUN_CONTEXT: >-
    {"runId":${{ toJSON(github.run_id) }},"runNumber":${{ toJSON(github.run_number) }},
    "runAttempt":${{ toJSON(github.run_attempt) }},"event":${{ toJSON(github.event_name) }},
    "ref":${{ toJSON(github.ref) }},"sha":${{ toJSON(github.sha) }},
    "repository":${{ toJSON(github.repository) }},
    "repositoryId":${{ toJSON(github.repository_id) }},
    "workflowRef":${{ toJSON(github.workflow_ref) }}}
  CS_CAMPAIGN: ${{ vars.CONTRACTSCRIBE_CAMPAIGN }}

jobs:
  invoke:
    name: Automatic campaign invocation
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      vars.CONTRACTSCRIBE_CAMPAIGN_LINEAGE != '' &&
      vars.CONTRACTSCRIBE_CAMPAIGN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Authenticate trusted trigger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$CS_HELPER" gate

      - name: ContractScribe automatic invocation
        id: invoke
        uses: SolusQuest/contract-scribe@<RELEASE_TAG_OR_SHA>
        with:
          repository-root: ${{ github.workspace }}
          input: ${{ env.CS_INPUT }}
          policy: ${{ env.CS_POLICY }}
          campaign: ${{ env.CS_CAMPAIGN }}
          configuration: ${{ env.CS_CONFIGURATION }}
          provider-api-key: ${{ secrets.CONTRACTSCRIBE_PROVIDER_API_KEY }}
          github-token: ${{ github.token }}
          acquisition-token: ${{ secrets.CONTRACTSCRIBE_ACQUISITION_TOKEN }}
